<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F1F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14150F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TED聞く">

<title>Inside the Mind of a Master Procrastinator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F2ED; --surface:#FBFCF8; --sunk:#E7E9DF;
  --ink:#16180F; --ink-2:#5E6356; --ink-3:#8E9384;
  --rule:#DBDDD1;
  --mark:#CBE84F; --mark-ink:#16180F; --mark-soft:#EAF4B6;
  --loop:#D8552F; --loop-soft:#F7E2D9;
  --ui:"Archivo",system-ui,sans-serif;
  --en:"Newsreader",Georgia,serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  color-scheme:light;
}
[hidden]{display:none !important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#14150F; --surface:#1D1F16; --sunk:#23261A;
  --ink:#EAECE0; --ink-2:#9BA08C; --ink-3:#6E7362;
  --rule:#2E3126;
  --mark:#B4D12F; --mark-ink:#14150F; --mark-soft:#363B1C;
  --loop:#F0724B; --loop-soft:#3B2318;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#14150F; --surface:#1D1F16; --sunk:#23261A;
  --ink:#EAECE0; --ink-2:#9BA08C; --ink-3:#6E7362;
  --rule:#2E3126;
  --mark:#B4D12F; --mark-ink:#14150F; --mark-soft:#363B1C;
  --loop:#F0724B; --loop-soft:#3B2318;
}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); display:flex; flex-direction:column;
  overscroll-behavior:none;
  /* iPhone のノッチとホームバーに被らないように */
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--loop); outline-offset:2px; border-radius:4px}

/* ── 上 ───────────────────────────── */
header{
  flex:none; background:var(--surface); border-bottom:1px solid var(--rule);
  padding:10px 16px 8px; display:flex; flex-direction:column; gap:8px;
}
.kicker{
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
}
.kicker b{font-weight:600; letter-spacing:.06em; color:var(--ink-2)}
.kicker a{color:inherit; text-decoration:underline; text-underline-offset:2px; text-transform:none; letter-spacing:.02em}
.off{margin-left:auto; text-transform:none; letter-spacing:.02em; font-weight:600}
.off.ok{color:var(--ink-2)}
.off.ok::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--mark); margin-right:5px; vertical-align:1px}
.rows{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.lbl{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); flex:none}
.chips{display:flex; gap:4px; flex-wrap:wrap}
.segtitle{font-size:11.5px; color:var(--ink-2); letter-spacing:.01em}
.chip{
  font-size:12px; font-weight:500; padding:5px 10px; border-radius:999px;
  border:1px solid var(--rule); background:var(--ground); color:var(--ink-2);
  font-variant-numeric:tabular-nums; line-height:1.1;
}
.chip[aria-pressed="true"]{background:var(--mark); border-color:var(--mark); color:var(--mark-ink); font-weight:600}

/* ── 本文 ─────────────────────────── */
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 0 10px}
.line{
  display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start;
  width:100%; text-align:left; padding:9px 16px 9px 10px;
  border-left:3px solid transparent; border-bottom:1px solid var(--rule);
}
.line:last-child{border-bottom:none}
.n{
  font-size:10px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums;
  padding-top:5px; text-align:right; letter-spacing:.02em;
}
.dur{display:block; font-weight:400; color:var(--ink-3); opacity:.75; font-size:9px; margin-top:2px}
.body{min-width:0}
.en,.ja{display:block}
.line [hidden]{display:none !important}
.en{font-family:var(--en); font-size:18px; line-height:1.5; letter-spacing:.005em}
.ja{font-family:var(--jp); font-size:13px; line-height:1.65; color:var(--ink-2); margin-top:4px}
.line.done .en,.line.done .ja{color:var(--ink-3)}
.line.now{background:var(--mark-soft); border-left-color:var(--mark)}
.line.now .en{color:var(--ink); font-weight:500}
.line.now .n{color:var(--ink-2)}
.line.mark-a,.line.mark-b{border-left-color:var(--loop)}
.tag{
  display:inline-block; font-size:9px; font-weight:700; letter-spacing:.08em;
  background:var(--loop); color:#fff; border-radius:3px; padding:1px 4px; margin-right:6px;
  vertical-align:2px;
}
.line.inrange{background:var(--loop-soft)}
.line.inrange.now{background:var(--mark-soft)}
.veil{filter:blur(4.5px); opacity:.55; user-select:none}
/* かたまりの区切り。区切りが「かたまり」のときだけ / を見せ、今のかたまりを濃く塗る */
.sl{display:none; color:var(--ink-3); font-weight:400}
main.slashes .sl{display:inline}
.ck{border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone}
main.slashes .ck.on{background:var(--mark); color:var(--mark-ink); padding:0 2px}

/* ── 下 ───────────────────────────── */
footer{
  flex:none; background:var(--surface); border-top:1px solid var(--rule);
  padding:8px 16px 10px; display:flex; flex-direction:column; gap:8px;
}
.hint{font-size:11px; color:var(--ink-3); min-height:14px; line-height:1.3}
.hint strong{color:var(--loop); font-weight:600}
.seekrow{display:flex; align-items:center; gap:10px}
.t{font-size:11px; color:var(--ink-2); font-variant-numeric:tabular-nums; flex:none; letter-spacing:.02em}
input[type=range]{flex:1; min-width:0; accent-color:var(--mark); height:20px}
.transport{display:flex; align-items:center; gap:8px}
.tbtn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--rule);
  background:var(--ground); display:grid; place-items:center; flex:none;
}
.tbtn svg{width:17px; height:17px; fill:var(--ink)}
#play{width:50px; height:50px; background:var(--ink); border-color:var(--ink)}
#play svg{width:20px; height:20px; fill:var(--ground)}
.spacer{flex:1}
.settings{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.settings .chip{padding:4px 9px; font-size:11px}
/* ラベルとボタンを1組にして、折り返すときは一緒に下の行へ */
.grp{display:inline-flex; align-items:center; gap:8px}
#reveal[aria-pressed="true"]{background:var(--loop); border-color:var(--loop); color:#fff}
@media (max-width:420px){ .en{font-size:17px} }
</style>
</head>
<body>

<header>
  <div class="kicker"><b>Tim Urban</b><span>TED 2016 &middot; 162 wpm</span><a class="src" href="https://www.ted.com/talks/tim_urban_inside_the_mind_of_a_master_procrastinator" target="_blank" rel="noopener">出典 CC BY-NC-ND 4.0</a><span class="off" id="offline"></span></div>
  <div class="rows">
    <span class="lbl">区間</span>
    <div class="chips" id="segs"></div>
    <span class="segtitle" id="segtitle"></span>
  </div>
  <div class="rows">
    <span class="lbl">字幕</span>
    <div class="chips" id="subs">
      <button class="chip" data-v="off">なし</button>
      <button class="chip" data-v="en">英</button>
      <button class="chip" data-v="ja">日</button>
      <button class="chip" data-v="both">英日</button>
    </div>
  </div>
  <div class="rows">
    <span class="lbl">練習</span>
    <div class="chips" id="steps">
      <button class="chip" data-v="imi">① 意味</button>
      <button class="chip" data-v="rep">② リピート</button>
      <button class="chip" data-v="ovl">③ 重ねる</button>
      <button class="chip" data-v="sha">④ シャドー</button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer>
  <div class="hint" id="hint"></div>
  <div class="seekrow">
    <span class="t" id="tnow">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="再生位置">
    <span class="t" id="tend">0:00</span>
  </div>
  <div class="transport">
    <button class="tbtn" id="prev" aria-label="前の文"><svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm3 6l8-6v12z"/></svg></button>
    <button class="tbtn" id="play" aria-label="再生"><svg viewBox="0 0 24 24" id="playicon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="tbtn" id="next" aria-label="次の文"><svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg></button>
    <span class="spacer"></span>
    <button class="chip" id="reveal" aria-pressed="false">今の文を見る</button>
  </div>
  <div class="settings">
    <span class="lbl">繰り返し</span>
    <div class="chips" id="loops">
      <button class="chip" data-v="off">流す</button>
      <button class="chip" data-v="step">止めて進む</button>
      <button class="chip" data-v="one" id="loop-one">1文</button>
      <button class="chip" data-v="ab">A–B</button>
      <button class="chip" data-v="seg">区間</button>
      <button class="chip" data-v="all">全体</button>
    </div>
  </div>
  <div class="settings">
    <span class="lbl">区切り</span>
    <div class="chips" id="units">
      <button class="chip" data-v="文">文</button>
      <button class="chip" data-v="塊">かたまり</button>
    </div>
  </div>
  <div class="settings">
    <span class="lbl">速さ</span>
    <div class="chips" id="rates">
      <button class="chip" data-v="0.6">0.6×</button>
      <button class="chip" data-v="0.7">0.7×</button>
      <button class="chip" data-v="0.85">0.85×</button>
      <button class="chip" data-v="1">1×</button>
    </div>
    <span class="grp"><span class="lbl">間</span>
    <div class="chips" id="gaps">
      <button class="chip" data-v="0">なし</button>
      <button class="chip" data-v="1.5">1.5秒</button>
      <button class="chip" data-v="3">3秒</button>
      <button class="chip" data-v="auto">自動</button>
    </div></span>
  </div>
</footer>

tually, the paper would come along, and then I would kind of do this.", "ja": "準備は万全にしておくんだけど、いざレポートが来ると、実際にはこうなる。", "塊": [{"en": "I would have it all ready", "s": 27.56, "e": 30.11}, {"en": "to go,", "s": 30.11, "e": 30.45}, {"en": "but then,", "s": 30.45, "e": 30.83}, {"en": "actually, the paper would come along,", "s": 30.83, "e": 32.97}, {"en": "and then I would kind of do this.", "s": 32.97, "e": 34.31}]}, {"s": 36.86, "e": 39.17, "en": "And that would happen every single paper.", "ja": "そしてそれが、どのレポートでも毎回起きた。", "塊": [{"en": "And that would happen every single paper.", "s": 36.86, "e": 39.17}]}, {"s": 39.68, "e": 45.89, "en": "But then came my 90-page senior thesis, a paper you're supposed to spend a year on.", "ja": "ところがそこへ、1年かけて書くはずの90ページの卒業論文がやってきた。", "塊": [{"en": "But then came my 90-page senior thesis,", "s": 39.68, "e": 43.57}, {"en": "a paper you're supposed", "s": 43.72, "e": 44.73}, {"en": "to spend a year on.", "s": 44.73, "e": 45.89}]}, {"s": 45.94, "e": 50.04, "en": "And I knew for a paper like that, my normal work flow was not an option.", "ja": "そういう論文では、いつものやり方は通用しないと分かっていた。", "塊": [{"en": "And I knew", "s": 45.94, "e": 46.73}, {"en": "for a paper like that,", "s": 46.73, "e": 47.67}, {"en": "my normal work flow", "s": 47.67, "e": 48.27}, {"en": "was not an option.", "s": 48.64, "e": 50.04}]}, {"s": 49.92, "e": 51.2, "en": "It was way too big a project.", "ja": "規模が大きすぎた。", "塊": [{"en": "It was way too big a project.", "s": 49.92, "e": 51.2}]}, {"s": 51.08, "e": 55.73, "en": "So I planned things out, and I decided I kind of had to go something like this.", "ja": "だから計画を立てて、こんなふうにやろうと決めた。", "塊": [{"en": "So I planned things out,", "s": 51.08, "e": 52.43}, {"en": "and I decided", "s": 52.43, "e": 52.97}, {"en": "I kind of had to go", "s": 53.42, "e": 54.83}, {"en": "something like this.", "s": 54.83, "e": 55.73}]}, {"s": 56.14, "e": 57.41, "en": "This is how the year would go.", "ja": "1年をこう進める、と。", "塊": [{"en": "This is how the year would go.", "s he ability to do things no other animal can do.", "ja": "だからこそ、脳にはもう一人いる。理性的な意思決定者。ほかのどんな動物にもできないことを、僕らにできるようにしてくれる存在だ。", "塊": [{"en": "Which is why", "s": 151.7, "e": 152.57}, {"en": "we have another guy in our brain,", "s": 152.57, "e": 153.91}, {"en": "the Rational Decision-Maker,", "s": 153.91, "e": 155.89}, {"en": "who gives us the ability", "s": 156.28, "e": 157.69}, {"en": "to do things", "s": 157.69, "e": 158.31}, {"en": "no other animal can do.", "s": 158.31, "e": 159.72}]}]}, "3": {"見出し": "パニック・モンスター", "文": [{"s": 0.0, "e": 1.94, "en": "We can visualize the future.", "ja": "僕らは未来を思い描ける。", "塊": [{"en": "We can visualize the future.", "s": 0.0, "e": 1.94}]}, {"s": 1.94, "e": 3.39, "en": "We can see the big picture.", "ja": "全体像を見渡せる。", "塊": [{"en": "We can see the big picture.", "s": 1.94, "e": 3.39}]}, {"s": 3.38, "e": 5.34, "en": "We can make long-term plans.", "ja": "長期的な計画を立てられる。", "塊": [{"en": "We can make long-term plans.", "s": 3.38, "e": 5.34}]}, {"s": 5.22, "e": 7.45, "en": "And he wants to take all of that into account.", "ja": "そして彼は、そのすべてを考慮に入れたい。", "塊": [{"en": "And he wants", "s": 5.22, "e": 5.77}, {"en": "to take all of that into account.", "s": 5.77, "e": 7.45}]}, {"s": 8.12, "e": 13.13, "en": "And he wants to just have us do whatever makes sense to be doing right now.", "ja": "今やるのが筋の通ることを、ただやらせたいと思っている。", "塊": [{"en": "And he wants", "s": 8.12, "e": 9.17}, {"en": "to just have us", "s": 9.17, "e": 10.17}, {"en": "do whatever makes sense", "s": 10.17, "e": 11.51}, {"en": "to be doing right now.", "s": 11.51, "e": 13.13}]}, {"s": 13.06, "e": 20.58, "en": "Now, sometimes it makes sense to be doing things that are easy and fun, like when you're having dinner or going to bed or enjoying well-earned leisure time.", "ja": "もちろん、楽で楽しいことをするのが筋の通る場合もある。夕食のときとか、寝るときとか、正当に稼いだ自由時間を楽しむときとか。", "塊": [{"en": "Now, sometimes it makes sense", "s": 13.06, "e": 14.53}, {"en": "to be doing things", "s": 14.53, "e": 15.67}, {"en": "that are easy and fun,", "s": 15.67, "e": 16.87}, {"en": "like when you're having dinner", "s": 16.87, "e": 17.93}, {"en": "or going to bed", "s": 17.93, "e": 18.83}, {"en": "or enjoying well-earned leisure time.", "s": 18.83, "e": 20.58}]}, {"s": 20.46, "e": 22.23, "en": "That's why there's an overlap.", "ja": "だから重なる部分がある。", "塊": [{"en": "That's why there's an overlap.", "s": 20.46, "e": 22.23}]}, {"s": 22.18, "e": 23.51, "en": "Sometimes they agree.", "ja": "意見が一致することもある。", "塊": [{"en": "Sometimes they agree.", "s": 22.18, "e": 23.51}]}, {"s": 23.6, "e": 31.84, "en": "But other times, it makes much more sense to be doing things that are harder and less pleasant, for the sake of the big picture.", "ja": "でもそれ以外のときは、全体像のために、もっと大変で楽しくないことをする方がずっと筋が通る。", "塊": [{"en": "But other times,", "s": 23.6, "e": 24.93}, {"en": "it makes much more sense", "s": 24.93, "e": 26.59}, {"en": "to be doing things", "s": 26.59, "e": 28.07}, {"en": "that are harder and less pleasant,", "s": 28.07, "e": 30.39}, {"en": "for the sake of the big picture.", "s": 30.39, "e": 31.84}]}, {"s": 31.72, "e": 33.65, "en": "And that's when we have a conflict.", "ja": "そこで対立が起きる。", "塊": [{"en": "And that's when we have a conflict.", "s": 31.72, "e": 33.65}]}, {"s": 34.0, "e": 46.34, "en": "And for the procrastinator, that conflict tends to end a certain way every time, leaving him spending a lot of time in this orange zone, an easy and fun place that's entirely out of the Makes Sense circle.", "ja": "そして先延ばしする人の場合、その対立は毎回決まった形で終わる。結果として彼は、このオレンジの領域で多くの時間を過ごすことになる。楽で楽しいけれど、「筋が通る」の円からは完全に外れた場所だ。", "塊": [{"en": "And for the procrastinator,", "s": 34.0, "e": 35.61}, {"en": "that conflict tends", "s": 35.61, "e": 36.51}, {"en": "to end a certain way every time,", "s": 36.51, "e": 38.15}, {"en": "leaving him spending a lot", "s": 38.22, "e": 39.59}, {"en": "of time in this orange zone,", "s": 39.59, "e": 41.35}, {"en": "an easy and fun", "s": 41.78, "e": 43.57}, {"en": "place that's entirely out", "s": 43.57, "e": 45.05}, {"en": "of the Makes Sense circle.", "s": 45.05, "e": 46.34}]}, {"s": 46.22, "e": 48.25, "en": "I call it the Dark Playground.", "ja": "僕はそこを「暗い遊び場」と呼んでいる。", "塊": [{"en": "I call it the Dark Playground.", "s": 46.22, "e": 48.25}]}, {"s": 51.18, "e": 57.34, "en": "Now, the Dark Playground is a place that all of you procrastinators out there know very well.", "ja": "暗い遊び場は、先延ばしするみなさんならよく知っている場所だ。", "塊": [{"en": "Now, the Dark Playground is a place", "s": 51.18, "e": 53.63}, {"en": "that all of you procrastinators out", "s": 53.63, "e": 55.59}, {"en": "there know very well.", "s": 55.59, "e": 57.34}]}, {"s": 57.3, "e": 62.19, "en": "It's where leisure activities happen at times when leisure activities are not supposed to be happening.", "ja": "本来なら娯楽をしているべきでない時間に、娯楽が行われる場所。", "塊": [{"en": "It's where leisure activities happen at times", "s": 57.3, "e": 59.57}, {"en": "when leisure activities are not supposed", "s": 59.57, "e": 61.39}, {"en": "to be happening.", "s": 61.39, "e": 62.19}]}, {"s": 62.34, "e": 72.31, "en": "The fun you have in the Dark Playground isn't actually fun, because it's completely unearned, and the air is filled with guilt, dread, anxiety, self-hatred -- all of those good procrastinator feelings.", "ja": "暗い遊び場で味わう楽しさは、実は楽しくない。まったく稼いだものではないし、空気は罪悪感、恐れ、不安、自己嫌悪で満ちている。先延ばしする人らしい、いい気分の数々だ。", "塊": [{"en": "The fun you have in the Dark Playground", "s": 62.34, "e": 64.41}, {"en": "isn't actually fun,", "s": 64.41, "e": 65.27}, {"en": "because it's completely unearned,", "s": 65.27, "e": 66.79}, {"en": "and the air is filled with guilt,", "s": 66.79, "e": 68.05}, {"en": "dread, anxiety,", "s": 68.24, "e": 69.69}, {"en": "self-hatred --", "s": 69.69, "e": 70.41}, {"en": "all of those good procrastinator feelings.", "s": 70.41, "e": 72.31}]}, {"s": 72.62, "e": 83.05, "en": "And the question is, in this situation, with the Monkey behind the wheel, how does the procrastinator ever get himself over here to this blue zone, a less pleasant place, but where really important things happen?", "ja": "問題はこうだ。この状況で、サルがハンドルを握っているのに、先延ばしする人はどうやってこの青い領域まで自分を連れていくのか。楽しくはないけれど、本当に大事なことが起きる場所まで。", "塊": [{"en": "And the question is,", "s": 72.62, "e": 73.97}, {"en": "in this situation,", "s": 73.97, "e": 74.85}, {"en": "with the Monkey behind the wheel,", "s": 74.85, "e": 76.25}, {"en": "how does the procrastinator ever get himself", "s": 76.32, "e": 78.49}, {"en": "over here to this blue zone,", "s": 78.49, "e": 79.95}, {"en": "a less pleasant place,", "s": 80.0, "e": 81.41}, {"en": "but where really important things happen?", "s": 81.41, "e": 83.05}]}, {"s": 83.34, "e": 95.37, "en": "Well, turns out the procrastinator has a guardian angel, someone who's always looking down on him and watching over him in his darkest moments -- someone called the Panic Monster.", "ja": "どうやら、先延ばしする人には守護天使がいるらしい。いつも見下ろして見守っていて、いちばん暗い瞬間に現れる誰か。「パニック・モンスター」と呼ばれる存在だ。", "塊": [{"en": "Well, turns out", "s": 83.34, "e": 85.45}, {"en": "the procrastinator has a guardian angel,", "s": 85.86, "e": 88.57}, {"en": "someone who's always looking down on him", "s": 88.58, "e": 90.47}, {"en": "and watching over him in his darkest", "s": 90.47, "e": 92.55}, {"en": "moments --", "s": 92.55, "e": 93.05}, {"en": "someone called the Panic Monster.", "s": 93.1, "e": 95.37}]}, {"s": 100.96, "e": 114.17, "en": "Now, the Panic Monster is dormant most of the time, but he suddenly wakes up anytime a deadline gets too close or there's danger of public embarrassment, a career disaster or some other scary consequence.", "ja": "パニック・モンスターはほとんどの時間眠っている。でも締切が近づきすぎたとき、人前で恥をかく危険があるとき、仕事上の破滅やそのほか恐ろしい結果が見えたときに、突然目を覚ます。", "塊": [{"en": "Now, the Panic Monster", "s": 100.96, "e": 103.39}, {"en": "is dormant most of the time,", "s": 103.39, "e": 104.95}, {"en": "but he suddenly wakes up", "s": 105.28, "e": 107.19}, {"en": "anytime a deadline gets too close", "s": 108.08, "e": 109.67}, {"en": "or there's danger of public embarrassment,", "s": 109.67, "e": 111.45}, {"en": "a career disaster", "s": 111.45, "e": 112.67}, {"en": "or some other scary consequence.", "s": 112.67, "e": 114.17}]}, {"s": 114.1, "e": 118.48, "en": "And importantly, he's the only thing the Monkey is terrified of.", "ja": "そして重要なのは、サルが恐れている唯一の存在が彼だということ。", "塊": [{"en": "And importantly,", "s": 114.1, "e": 115.09}, {"en": "he's the only thing", "s": 115.16, "e": 116.63}, {"en": "the Monkey is terrified of.", "s": 116.63, "e": 118.48}]}, {"s": 118.36, "e": 128.13, "en": "Now, he became very relevant in my life pretty recently, because the people of TED reached out to me about six months ago and invited me to do a TED Talk.", "ja": "彼は最近、僕の人生でとても重要になった。半年ほど前にTEDの人たちから連絡が来て、TEDトークをしないかと誘われたからだ。", "塊": [{"en": "Now, he became", "s": 118.36, "e": 119.91}, {"en": "very relevant in my life pretty recently,", "s": 119.91, "e": 122.39}, {"en": "because the people of TED reached out", "s": 122.68, "e": 125.21}, {"en": "to me about six months ago", "s": 125.21, "e": 126.51}, {"en": "and invited me", "s": 126.51, "e": 127.15}, {"en": "to do a TED Talk.", "s": 127.15, "e": 128.13}]}, {"s": 133.14, "e": 135.36, "en": "Now, of course, I said yes.", "ja": "もちろん、僕は「はい」と答えた。", "塊": [{"en": "Now, of course,", "s": 133.14, "e": 134.47}, {"en": "I said yes.", "s": 134.47, "e": 135.36}]}, {"s": 135.34, "e": 139.21, "en": "It's always been a dream of mine to have done a TED Talk in the past.", "ja": "「過去にTEDトークをやったことがある」というのは、ずっと僕の夢だった。", "塊": [{"en": "It's always been a dream of mine", "s": 135.34, "e": 136.67}, {"en": "to have done", "s": 136.67, "e": 137.55}, {"en": "a TED Talk in the past.", "s": 137.55, "e": 139.21}]}, {"s": 150.22, "e": 154.36, "en": "But in the middle of all this excitement, the Rational Decision-Maker seemed to have something else on his mind.", "ja": "でもその興奮の真ん中で、理性的な意思決定者は何か別のことを考えているようだった。", "塊": [{"en": "But in the middle", "s": 150.22, "e": 151.19}, {"en": "of all this excitement,", "s": 151.19, "e": 151.87}, {"en": "the Rational Decision-Maker seemed", "s": 151.87, "e": 153.21}, {"en": "to have something else on his mind.", "s": 153.21, "e": 154.36}]}, {"s": 154.24, "e": 158.13, "en": "He was saying, \"Are we clear on what we just accepted?", "ja": "彼は言っていた。「今引き受けたものが何か、分かっているのか？", "塊": [{"en": "He was saying,", "s": 154.24, "e": 154.97}, {"en": "\"Are we clear on what we just accepted?", "s": 154.97, "e": 158.13}]}, {"s": 158.1, "e": 161.86, "en": "Do we get what's going to be now happening one day in the future?", "ja": "いつか未来のある日に何が起きるのか、理解しているのか？", "塊": [{"en": "Do we get what's going", "s": 158.1, "e": 160.33}, {"en": "to be now happening", "s": 160.33, "e": 161.23}, {"en": "one day in the future?", "s": 161.23, "e": 161.86}]}, {"s": 161.78, "e": 183.13, "en": "We need to sit down and work on this right now.\" And the Monkey said, \"Totally agree, but let's just open Google Earth and zoom in to the bottom of India, like 200 feet above the ground, and scroll up for two and a half hours til we get to the top of the country, so we can get a better feel for India.\"  So that's what we did that day.", "ja": "今すぐ座って、これに取りかかる必要がある」するとサルが言った。「まったく同感だ。でもその前にGoogle Earthを開いて、インドの南端まで、地上60メートルくらいまで寄って、そこから2時間半スクロールして国の北端まで行こう。インドの感じがもっとよく掴めるから」というわけで、その日僕らはそれをやった。", "塊": [{"en": "We need to sit down", "s": 161.78, "e": 162.59}, {"en": "and work on this right now.\"", "s": 162.59, "e": 163.81}, {"en": "And the Monkey said,", "s": 163.81, "e": 165.01}, {"en": "\"Totally agree,", "s": 165.04, "e": 165.79}, {"en": "but let's just open Google Earth", "s": 165.79, "e": 167.29}, {"en": "and zoom in to the bottom", "s": 167.29, "e": 168.53}, {"en": "of India,", "s": 168.53, "e": 169.03}, {"en": "like 200 feet above the ground,", "s": 169.03, "e": 170.17}, {"en": "and scroll up", "s": 170.26, "e": 170.91}, {"en": "for two and a half hours", "s": 170.91, "e": 171.91}, {"en": "til we get", "s": 172.06, "e": 172.49}, {"en": "to the top of the country,", "s": 172.49, "e": 173.47}, {"en": "so we can get a better feel", "s": 173.47, "e": 174.81}, {"en": "for India.\" So that's what we did that day.", "s": 174.81, "e": 183.13}]}]}, "4": {"見出し": "TEDの準備", "文": [{"s": 0.68, "e": 7.7, "en": "As six months turned into four and then two and then one, the people of TED decided to release the speakers.", "ja": "半年が4ヶ月になり、2ヶ月になり、1ヶ月になった頃、TEDの人たちが登壇者を発表することにした。", "塊": [{"en": "As six months turned into four", "s": 0.68, "e": 2.93}, {"en": "and then two and then one,", "s": 2.93, "e": 4.65}, {"en": "the people of TED decided", "s": 4.65, "e": 5.99}, {"en": "to release the speakers.", "s": 5.99, "e": 7.7}]}, {"s": 7.58, "e": 11.72, "en": "And I opened up the website, and there was my face staring right back at me.", "ja": "サイトを開いたら、僕の顔がこっちを見返していた。", "塊": [{"en": "And I opened up the website,", "s": 7.58, "e": 9.23}, {"en": "and there was my face", "s": 9.23, "e": 10.47}, {"en": "staring right back at me.", "s": 10.47, "e": 11.72}]}, {"s": 11.62, "e": 13.37, "en": "And guess who woke up?", "ja": "さて、誰が目を覚ましたと思う？", "塊": [{"en": "And guess who woke up?", "s": 11.62, "e": 13.37}]}, {"s": 17.24, "e": 22.61, "en": "So the Panic Monster starts losing his mind, and a few seconds later, the whole system's in mayhem.", "ja": "パニック・モンスターが取り乱し始めて、数秒後には全体が大混乱になる。", "塊": [{"en": "So the Panic Monster", "s": 17.24, "e": 18.79}, {"en": "starts losing his mind,", "s": 18.79, "e": 19.91}, {"en": "and a few seconds later,", "s": 19.91, "e": 21.11}, {"en": "the whole system's in mayhem.", "s": 21.11, "e": 22.61}]}, {"s": 27.36, "e": 31.41, "en": "And the Monkey -- remember, he's terrified of the Panic Monster -- boom, he's up the tree!", "ja": "そしてサルは、彼がパニック・モンスターを恐れているのを思い出してほしい、ばん、木の上に逃げる。", "塊": [{"en": "And the Monkey --", "s": 27.36, "e": 28.41}, {"en": "remember, he's terrified", "s": 28.41, "e": 29.49}, {"en": "of the Panic Monster --", "s": 29.49, "e": 30.21}, {"en": "boom, he's up the tree!", "s": 30.21, "e": 31.41}]}, {"s": 31.66, "e": 37.38, "en": "And finally, finally, the Rational Decision-Maker can take the wheel and I can start working on the talk.",  "but in the end,", "s": 63.11, "e": 64.13}, {"en": "it works.", "s": 64.13, "e": 65.51}]}, {"s": 65.8, "e": 69.83, "en": "This is what I decided to write about on the blog a couple of years ago.", "ja": "これを数年前、ブログに書こうと決めた。", "塊": [{"en": "This is what I decided", "s": 65.8, "e": 66.91}, {"en": "to write about on the blog", "s": 66.91, "e": 68.47}, {"en": "a couple of years ago.", "s": 68.74, "e": 69.83}]}, {"s": 69.86, "e": 72.46, "en": "When I did, I was amazed by the response.", "ja": "書いてみて、反応に驚いた。", "塊": [{"en": "When I did,", "s": 69.86, "e": 70.67}, {"en": "I was amazed by the response.", "s": 70.72, "e": 72.46}]}, {"s": 72.46, "e": 78.89, "en": "Literally thousands of emails came in, from all different kinds of people from all over the world, doing all different kinds of things.", "ja": "文字どおり何千通ものメールが、世界中のあらゆる種類の人たちから、あらゆる種類の仕事をしている人たちから届いた。", "塊": [{"en": "Literally thousands of emails came in,", "s": 72.46, "e": 74.65}, {"en": "from all different kinds of people", "s": 74.65, "e": 76.27}, {"en": "from all over the world,", "s": 76.27, "e": 77.35}, {"en": "doing all different kinds of things.", "s": 77.35, "e": 78.89}]}, {"s": 78.9, "e": 84.61, "en": "These are people who were nurses, bankers, painters, engineers and lots and lots of PhD students.", "ja": "看護師、銀行員、画家、エンジニア、そして本当にたくさんの博士課程の学生たち。", "塊": [{"en": "These are people", "s": 78.9, "e": 79.79}, {"en": "who were nurses,", "s": 79.79, "e": 80.47}, {"en": "bankers, painters,", "s": 80.56, "e": 81.93}, {"en": "engineers and lots", "s": 81.96, "e": 83.11}, {"en": "and lots of PhD students.", "s": 83.11, "e": 84.61}]}, {"s": 86.44, "e": 96.67, "en": "And they were all writing, saying the same thing: \"I have this problem too.\" But what struck me was the contrast between the light tone of the post and the heaviness of these emails.", "ja": "全員が同じことを書いていた。「自分もこの問題を抱えています」でも僕が引っかかったのは、記事の軽い調子と、これらのメールの重さとの落差だった。", "塊": [{"en": "And they were all writing,", "s": 86.44, "e": 87.93}, {"en": "saying the same  today, the examples I've given, they all have deadlines.", "ja": "今日話してきたこと、挙げてきた例には、全部締切がある。", "塊": [{"en": "Everything I've talked about today,", "s": 119.94, "e": 121.35}, {"en": "the examples I've given,", "s": 121.35, "e": 122.15}, {"en": "they all have deadlines.", "s": 122.15, "e": 123.08}]}, {"s": 122.96, "e": 129.52, "en": "And when there's deadlines, the effects of procrastination are contained to the short term because the Panic Monster gets involved.", "ja": "締切があるとき、先延ばしの影響は短期に収まる。パニック・モンスターが出てくるからだ。", "塊": [{"en": "And when there's deadlines,", "s": 122.96, "e": 123.99}, {"en": "the effects of procrastination are contained", "s": 123.99, "e": 126.55}, {"en": "to the short term", "s": 126.55, "e": 128.05}, {"en": "because the Panic Monster gets involved.", "s": 128.05, "e": 129.52}]}, {"s": 129.52, "e": 134.75, "en": "But there's a second kind of procrastination that happens in situations when there is no deadline.", "ja": "でも締切がない状況で起きる、第二の種類の先延ばしがある。", "塊": [{"en": "But there's a second kind of procrastination", "s": 129.52, "e": 131.57}, {"en": "that happens in situations", "s": 131.57, "e": 133.17}, {"en": "when there is no deadline.", "s": 133.17, "e": 134.75}]}, {"s": 134.7, "e": 147.45, "en": "So if you wanted a career where you're a self-starter -- something in the arts, something entrepreneurial -- there's no deadlines on those things at first, because nothing's happening, not until you've gone out and done the hard work to get momentum, get things going.", "ja": "たとえば自分で動き出す必要のある仕事、芸術の世界や起業のようなものを目指すなら、最初のうち締切は存在しない。何も起きていないからだ。自分が外に出て、勢いをつけるための大変な仕事をするまでは。", "塊": [{"en": "So if you wanted a career", "s": 134.7, "e": 136.23}, {"en": "where you're a self-starter --", "s": 136.23, "e": 137.33}, {"en": "something in the arts,", "s": 137.33, "e": 138.23}, {"en": "something entrepreneurial --", "s": 138.23, "e": 139.75}, {"en": "there's no deadlines on those things", "s": 139.9, "e": 141.47}, {"en": "at first,", "s": 141.47, "e": 141.93}, {"en": "because nothing's happening,", "s": 141.93, "e": 143.27}, {"en": "not until you've gone out", "s": 143.52, "e": 144.81}, {"en": "and done the hard work", "s": 144.81, "e": 145.57}, {"en": "to get momentum,", "s": 145.57, "e": 146.43}, {"en": "get things going.", "s": 146.43, "e": 147.45}]}, {"s": 147.38, "e": 159.09, "en": "There's also all kinds of important things outside of your career that don't involve any deadlines, like seeing your family or exercising and taking care of your health, working on your relationship or getting out of a relationship that isn't working.", "ja": "仕事以外にも、締切のない大事なことはいくらでもある。家族に会うこと、運動して健康に気をつけること、関係を良くしようと努めること、うまくいっていない関係から抜け出すこと。", "塊": [{"en": "There's also all kinds", "s": 147.38, "e": 148.43}, {"en": "of important things outside of your career", "s": 148.43, "e": 150.05}, {"en": "that don't involve any deadlines,", "s": 150.05, "e": 151.69}, {"en": "like seeing your family", "s": 151.69, "e": 152.71}, {"en": "or exercising and taking", "s": 152.71, "e": 153.89}, {"en": "care of your health,", "s": 153.89, "e": 154.73}, {"en": "working on your relationship", "s": 154.86, "e": 156.57}, {"en": "or getting out of a relationship", "s": 156.57, "e": 158.23}, {"en": "that isn't working.", "s": 158.23, "e": 159.09}]}]}, "5": {"見出し": "締切の無い先延ばし", "文": [{"s": 0.56, "e": 12.3, "en": "Now if the procrastinator's only mechanism of doing these hard things is the Panic Monster, that's a problem, because in all of these non-deadline situations, the Panic Monster doesn't show up.", "ja": "こうした大変なことをやるための仕組みが、先延ばしする人にとってパニック・モンスターだけだとしたら、それは問題だ。なぜなら、締切のないこれらの状況では、パニック・モンスターは現れないから。", "塊": [{"en": "Now if the procrastinator's only mechanism", "s": 0.56, "e": 3.85}, {"en": "of doing these hard things", "s": 3.85, "e": 6.01}, {"en": "is the Panic Monster,", "s": 6.01, "e": 7.19}, {"en": "that's a problem,", "s": 7.19, "e": 7.81}, {"en": "because in all of these non-deadline situations,", "s": 7.81, "e": 10.03}, {"en": "the Panic Monster doesn't show const 保存キー = "ted-tim-urban-v1";
let st = {seg:1, subs:"en", loop:"off", rate:1, gap:0, unit:"文", step:null, a:null, b:null};
try{ const r = localStorage.getItem(保存キー); if(r) Object.assign(st, JSON.parse(r)); }catch(e){}
st.a = null; st.b = null;

const audio = new Audio();
audio.preload = "metadata";
let 文 = [], idx = -1, ループ中 = false, 見せる = false, 手で動かした = 0, つまみ中 = false;
// 単位 = 区切りの1つ1つ。区切りが「文」なら文、「かたまり」なら3〜6語のかたまり。{s, e, i（文の番号）, k（文の中のかたまり番号。文なら -1）}
let 単位 = [], u = -1;
// 1つ繰り返す・止めて進む で扱っている単位の番号。u（今の単位）は境目の直前に次へ進むので、ループの的には使えない
let 固定 = -1;
let 待ちタイマー = null;

const $ = s => document.querySelector(s);
const main = $("#main"), hint = $("#hint"), seek = $("#seek");

// シャドーイングの4段階。意味を先に入れてから、言い返す → 重ねる → 追いかける の順に音へ近づく
const 段階 = {
  imi: {subs:"both", unit:"文", loop:"step", gap:"auto", rate:0.85,
        説明:"<strong>① 意味</strong>　英日の字幕で1文ずつ止まる。止まっている間に、英文のどこが日本語のどこか確かめる"},
  rep: {subs:"en", unit:"塊", loop:"step", gap:"auto", rate:0.85,
        説明:"<strong>② リピート</strong>　かたまりごとに止まる。止まったら、なるべく英文を見ずに真似して言う。言えなかったら ◀ でもう一度"},
  ovl: {subs:"en", unit:"文", loop:"one", gap:1.5, rate:0.85,
        説明:"<strong>③ 重ねる</strong>　英文を見ながら、音と同時に言う。1文を繰り返すので、言えたら ▶ で次の文へ"},
  sha: {subs:"off", unit:"文", loop:"one", gap:1.5, rate:0.85,
        説明:"<strong>④ シャドー</strong>　字幕なしで、少し遅れて追いかけて言う。詰まる文は ③ に戻す。慣れたら速さを 1× に"},
};

function 秒表示(x){ x = Math.max(0, x||0); const m = Math.floor(x/60), s = Math.floor(x%60); return m + ":" + String(s).padStart(2,"0"); }
function しまう(){ try{ localStorage.setItem(保存キー, JSON.stringify({seg:st.seg, subs:st.subs, loop:st.loop, rate:st.rate, gap:st.gap, unit:st.unit, step:st.step})); }catch(e){} }

/* ── 組み立て ───────────────────── */
(function 区間ボタン(){
  const box = $("#segs");
  for(const k of Object.keys(DATA)){
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.v = k; b.textContent = k;
    box.appendChild(b);
  }
})();

function 描く(){
  文 = DATA[st.seg].文;
  main.innerHTML = "";
  文.forEach((s, i) => {
    const row = document.createElement("button");
    row.className = "line"; row.dataset.i = i;
    row.innerHTML =
      '<span class="n">' + (i+1) + '<span class="dur">' + (s.e - s.s).toFixed(1) + 's</span></span>' +
      '<span class="body">' +
        '<span class="en"></span>' +
        '<span class="ja"></span>' +
      '</span>';
    // 英文はかたまりごとに包む。区切りが「かたまり」のときだけ / が見えて、今のかたまりが光る
    const en = row.querySelector(".en");
    (s.塊 || [{en: s.en}]).forEach((c, k) => {
      if(k){ const sl = document.createElement("span"); sl.className = "sl"; sl.textContent = " / "; en.appendChild(sl); }
      const ck = document.createElement("span"); ck.className = "ck"; ck.dataset.k = k; ck.textContent = c.en;
      en.appendChild(ck);
    });
    row.querySelector(".ja").textContent = s.ja;
    main.appendChild(row);
  });
  idx = -1; u = -1; 固定 = -1; 待ちをやめる();
  audio.src = "audio/" + st.seg + ".mp3";
  audio.playbackRate = st.rate;
  st.a = st.b = null;
  単位を作る();
  字幕を当てる(); 印を塗る(); 助言(); ボタンを揃える();
  $("#tend").textContent = 秒表示(文[文.length-1].e);
  $("#segtitle").textContent = DATA[st.seg].見出し;
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "区間" + st.seg + "｜" + DATA[st.seg].見出し,
      artist: "Tim Urban", album: "Inside the Mind of a Master Procrastinator"
    });
  }
}

function 単位を作る(){
  単位 = st.unit === "塊"
    ? 文.flatMap((s, i) => (s.塊 || [{s:s.s, e:s.e}]).map((c, k) => ({s:c.s, e:c.e, i, k: s.塊 ? k : -1})))
    : 文.map((s, i) => ({s:s.s, e:s.e, i, k:-1}));
  main.classList.toggle("slashes", st.unit === "塊");
  u = -1;
}

function 字幕を当てる(){
  const 英 = st.subs === "en" || st.subs === "both";
  const 日 = st.subs === "ja" || st.subs === "both";
  main.querySelectorAll(".line").forEach((row, i) => {
    // 英文は「なし」でも場所は取らせる。行の長さで文の長さの見当がつく方が書き取りに効く
    row.querySelector(".en").classList.toggle("veil", !英 && !(見せる && i === idx));
    row.querySelector(".ja").hidden = !日;
  });
}

function 印を塗る(){
  const a = st.a, b = st.b;
  main.querySelectorAll(".line").forEach((row, i) => {
    row.classList.toggle("now", i === idx);
    row.classList.toggle("done", idx >= 0 && i < idx);
    row.classList.toggle("mark-a", a === i);
    row.classList.toggle("mark-b", b === i);
    row.classList.toggle("inrange", a !== null && b !== null && i >= a && i <= b);
    const old = row.querySelector(".tag"); if(old) old.remove();
    if(a === i || b === i){
      const t = document.createElement("span");
      t.className = "tag"; t.textContent = (a === i ? "A" : "B");
      row.querySelector(".body").prepend(t);
    }
  });
}

function 塊を塗る(){
  main.querySelectorAll(".ck.on").forEach(el => el.classList.remove("on"));
  const x = 単位[u];
  if(st.unit !== "塊" || !x || x.k < 0) return;
  const el = main.querySelector('.line[data-i="' + x.i + '"] .ck[data-k="' + x.k + '"]');
  if(el) el.classList.add("on");
}

function ボタンを揃える(){
  const 当てる = (id, v) => document.querySelectorAll("#" + id + " .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v == v)));
  当てる("segs", st.seg); 当てる("subs", st.subs); 当てる("loops", st.loop);
  当てる("rates", st.rate); 当てる("gaps", st.gap); 当てる("units", st.unit); 当てる("steps", st.step);
  $("#loop-one").textContent = st.unit === "塊" ? "1かたまり" : "1文";
  $("#reveal").setAttribute("aria-pressed", String(見せる));
}

function 助言(){
  if(st.step && 段階[st.step]){ hint.innerHTML = 段階[st.step].説明; return; }
  if(st.loop === "ab"){
    if(st.a === null) hint.innerHTML = "繰り返したい範囲の<strong>最初の文</strong>をタップ";
    else if(st.b === null) hint.innerHTML = "次に<strong>最後の文</strong>をタップ（同じ文でもいい）";
    else hint.innerHTML = (st.a+1) + "〜" + (st.b+1) + " を繰り返し中。もう一度タップすると引き直せる";
  } else if(st.loop === "one"){ hint.textContent = (st.unit === "塊" ? "今のかたまり" : "今の1文") + "を繰り返す。文をタップするとそこへ移る";
  } else if(st.loop === "step"){ hint.textContent = (st.unit === "塊" ? "かたまり" : "1文") + "ごとに止まって、間のあと次へ進む。間の「自動」は聞いた長さ＋少し";
  } else if(st.loop === "seg"){ hint.textContent = "区間の終わりまで行ったら頭に戻る";
  } else if(st.loop === "all"){ hint.textContent = "区間1から5まで通して流す。5の後は1に戻る";
  } else { hint.textContent = "文をタップするとそこから再生。字幕なしで聞いて「今の文」で答え合わせ"; }
}

/* ── 動き ───────────────────────── */
function 今どこ(t){
  for(let i = 単位.length - 1; i >= 0; i--) if(t >= 単位[i].s - 0.05) return i;
  return 0;   // 冒頭の拍手や間はこれから読む単位に含める
}

function 文の頭(i){ const j = 単位.findIndex(x => x.i === i); return j < 0 ? 0 : j; }

function 飛ぶ(秒, 鳴らす){
  待ちをやめる();
  audio.currentTime = Math.max(0, 秒);
  if(鳴らす !== false) audio.play().catch(()=>{});
}

// 間の長さ。「自動」は聞いた長さ（速さで伸びた分も込み）＋0.8秒。言い返すのに要る時間の目安
function 間の秒(x){
  if(st.gap === "auto") return x ? Math.max(1.2, (x.e - x.s) / st.rate + 0.8) : 1.5;
  return +st.gap || 0;
}

function 待ちをやめる(){
  if(待ちタイマー){ clearTimeout(待ちタイマー); 待ちタイマー = null; }
  ループ中 = false;
}

// 止めて、待ってから「次」をして鳴らし直す。待ちが 0 なら止めずに「次」だけ
function 間をあけて(待ち, 次){
  if(ループ中) return;
  ループ中 = true;
  if(待ち > 0){
    audio.pause();
    待ちタイマー = setTimeout(() => { 待ちタイマー = null; 次(); audio.play().catch(()=>{}); ループ中 = false; }, 待ち * 1000);
  } else {
    次(); ループ中 = false;
  }
}

// 境目を越えたら戻す・止める。rAF は iPhone で画面を消すと止まるので、
// timeupdate と 0.1 秒のタイマーからも呼ぶ（どれか1つが生きていれば効く）
function 境目を見る(){
  if(ループ中 || audio.paused || !単位.length) return;
  const t = audio.currentTime;
  if(st.loop === "one"){
    if(固定 < 0) 固定 = 今どこ(t);
    const x = 単位[固定];
    if(t >= x.e - 0.03 || t < x.s - 0.3) 間をあけて(間の秒(x), () => { audio.currentTime = x.s; });
  } else if(st.loop === "step"){
    if(固定 < 0) 固定 = 今どこ(t);
    const x = 単位[固定];
    if(t < x.s - 0.3){ 固定 = 今どこ(t); return; }
    if(t >= x.e - 0.03){
      const n = 固定 + 1;
      if(n >= 単位.length){ audio.pause(); return; }
      間をあけて(間の秒(x), () => { 固定 = n; audio.currentTime = 単位[n].s; });
    }
  } else if(st.loop === "ab" && st.a !== null && st.b !== null){
    if(t >= 文[st.b].e - 0.03 || t < 文[st.a].s - 0.3) 間をあけて(間の秒(null), () => { audio.currentTime = 文[st.a].s; });
  }
}
audio.addEventListener("timeupdate", 境目を見る);
setInterval(境目を見る, 100);

function 拍(){
  const t = audio.currentTime;
  if(!つまみ中){
    const 尻 = 文[文.length-1].e;
    seek.value = Math.round(Math.min(1, t / 尻) * 1000);
    $("#tnow").textContent = 秒表示(t);
  }
  境目を見る();
  if(単位.length){
    const 今u = ((st.loop === "one" || st.loop === "step") && 固定 >= 0) ? 固定 : 今どこ(t);
    if(今u !== u){ u = 今u; 塊を塗る(); }
    const 新 = 単位[u].i;
    if(新 !== idx){
      idx = 新; 見せる = false;
      印を塗る(); 字幕を当てる(); ボタンを揃える(); 塊を塗る();
      const row = main.querySelector('.line[data-i="' + idx + '"]');
      if(row && Date.now() - 手で動かした > 5000) row.scrollIntoView({block:"center", behavior:"smooth"});
    }
  }
  requestAnimationFrame(拍);
}
requestAnimationFrame(拍);

audio.addEventListener("ended", () => {
  if(st.loop === "all"){
    // 全体：区間の終わりで次の区間へ。区間5の後は区間1に戻る
    st.seg = st.seg % 5 + 1; しまう(); 描く(); ボタンを揃える();
    audio.play().catch(()=>{});
    return;
  }
  if(st.loop === "seg"){ 間をあけて(間の秒(null), () => { audio.currentTime = 0; }); if(!(間の秒(null) > 0)) audio.play().catch(()=>{}); }
  else 再生表示(false);
});
audio.addEventListener("play", () => { 再生表示(true); 眠らせない(); });
audio.addEventListener("pause", () => { if(!ループ中) 再生表示(false); });

function 再生表示(鳴ってる){
  $("#playicon").innerHTML = 鳴ってる
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $("#play").setAttribute("aria-label", 鳴ってる ? "一時停止" : "再生");
}

let 錠 = null;
async function 眠らせない(){
  try{ if("wakeLock" in navigator && !錠) 錠 = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && !audio.paused) 眠らせない(); });

/* ── 操作 ───────────────────────── */
main.addEventListener("click", e => {
  const row = e.target.closest(".line"); if(!row) return;
  const i = +row.dataset.i;
  if(st.loop === "ab"){
    if(st.a === null || st.b !== null){ st.a = i; st.b = null; 飛ぶ(文[i].s); }
    else if(i >= st.a){ st.b = i; 飛ぶ(文[st.a].s); }
    else { st.a = i; 飛ぶ(文[i].s); }
    印を塗る(); 助言();
  } else {
    固定 = 文の頭(i);
    飛ぶ(単位[固定].s);
  }
});

$("#play").addEventListener("click", () => {
  // 間の途中で押したら、待ちをやめて止まる（再生ボタンの見た目は鳴っている扱いのままなので）
  if(ループ中){ 待ちをやめる(); 再生表示(false); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
});
function 今の単位(){ return ((st.loop === "one" || st.loop === "step") && 固定 >= 0) ? 固定 : 今どこ(audio.currentTime); }
$("#prev").addEventListener("click", () => {
  const 今 = 今の単位();
  const 頭に戻すか = 今 >= 0 && audio.currentTime - 単位[今].s > 1.2;
  const j = 頭に戻すか ? 今 : Math.max(0, 今 - 1);
  固定 = j;
  飛ぶ(単位[j].s);
});
$("#next").addEventListener("click", () => { const j = Math.min(単位.length - 1, 今の単位() + 1); 固定 = j; 飛ぶ(単位[j].s); });

seek.addEventListener("pointerdown", () => { つまみ中 = true; });
seek.addEventListener("change", () => {
  つまみ中 = false;
  const 先 = (seek.value / 1000) * 文[文.length-1].e;
  固定 = 今どこ(先);
  飛ぶ(先, !audio.paused);
});
seek.addEventListener("input", () => { $("#tnow").textContent = 秒表示((seek.value / 1000) * 文[文.length-1].e); });

main.addEventListener("scroll", () => { 手で動かした = Date.now(); }, {passive:true});

function 束ねる(id, 効く){
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    // 段階を選んだ後に設定を手で変えたら、段階の印は外す
    if(id !== "steps" && id !== "segs") st.step = null;
    効く(b.dataset.v); ボタンを揃える(); 助言(); しまう();
  });
}
function 区切りを変える(v){
  st.unit = v; 単位を作る();
  固定 = 今どこ(audio.currentTime); 塊を塗る();
}
束ねる("segs",  v => { const 鳴ってた = !audio.paused; st.seg = +v; 描く(); if(鳴ってた) audio.play().catch(()=>{}); });
束ねる("subs",  v => { st.subs = v; 字幕を当てる(); });
束ねる("loops", v => { 待ちをやめる(); st.loop = v; st.a = st.b = null; 固定 = Math.max(0, 今どこ(audio.currentTime)); 印を塗る(); });
束ねる("rates", v => { st.rate = +v; audio.playbackRate = st.rate; });
束ねる("gaps",  v => { st.gap = v === "auto" ? "auto" : +v; });
束ねる("units", v => 区切りを変える(v));
束ねる("steps", v => {
  const p = 段階[v]; if(!p) return;
  待ちをやめる();
  st.step = v; st.subs = p.subs; st.loop = p.loop; st.gap = p.gap; st.rate = p.rate; st.a = st.b = null;
  audio.playbackRate = st.rate;
  区切りを変える(p.unit);
  字幕を当てる(); 印を塗る();
});

$("#reveal").addEventListener("click", () => { 見せる = !見せる; 字幕を当てる(); ボタンを揃える(); });

document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){ e.preventDefault(); $("#play").click(); }
  if(e.code === "ArrowLeft"){ e.preventDefault(); $("#prev").click(); }
  if(e.code === "ArrowRight"){ e.preventDefault(); $("#next").click(); }
});

描く(); 再生表示(false);

/* ── 圏外で使う準備 ─────────────────── */
// sw.js の 音声キャッシュ と揃える（殻のキャッシュとは別。コードを直しても音声は取り直さない）
const キャッシュ名 = "ted-audio-v2";
const 音源一覧 = Object.keys(DATA).map(k => new URL("audio/" + k + ".mp3", location.href).href);

async function 保存状況(){
  const el = $("#offline");
  if(!("caches" in window)){ el.textContent = ""; return 0; }
  try{
    const c = await caches.open(キャッシュ名);
    let n = 0;
    for(const u of 音源一覧) if(await c.match(u)) n++;
    el.textContent = n >= 音源一覧.length ? "圏外OK" : "保存中 " + n + "/" + 音源一覧.length;
    el.classList.toggle("ok", n >= 音源一覧.length);
    return n;
  }catch(e){ el.textContent = ""; return 0; }
}

async function 貯める(){
  if(!("caches" in window)) return;
  try{
    const c = await caches.open(キャッシュ名);
    for(const u of 音源一覧){
      if(await c.match(u)) continue;
      try{ const r = await fetch(u); if(r.ok){ await c.put(u, r); 保存状況(); } }catch(e){}
    }
  }catch(e){}
  保存状況();
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
保存状況().then(n => { if(n < 音源一覧.length) 貯める(); });
</script>

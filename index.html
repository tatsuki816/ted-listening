<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F1F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14150F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TED聞く">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>TED リスニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F2ED; --surface:#FBFCF8; --sunk:#E7E9DF;
  --ink:#16180F; --ink-2:#5E6356; --ink-3:#8E9384;
  --rule:#DBDDD1;
  --mark:#CBE84F; --mark-ink:#16180F; --mark-soft:#EAF4B6;
  --loop:#D8552F; --loop-soft:#F7E2D9;
  --ui:"Archivo",system-ui,sans-serif;
  --en:"Newsreader",Georgia,serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  color-scheme:light;
}
[hidden]{display:none !important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#14150F; --surface:#1D1F16; --sunk:#23261A;
  --ink:#EAECE0; --ink-2:#9BA08C; --ink-3:#6E7362;
  --rule:#2E3126;
  --mark:#B4D12F; --mark-ink:#14150F; --mark-soft:#363B1C;
  --loop:#F0724B; --loop-soft:#3B2318;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#14150F; --surface:#1D1F16; --sunk:#23261A;
  --ink:#EAECE0; --ink-2:#9BA08C; --ink-3:#6E7362;
  --rule:#2E3126;
  --mark:#B4D12F; --mark-ink:#14150F; --mark-soft:#363B1C;
  --loop:#F0724B; --loop-soft:#3B2318;
}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); display:flex; flex-direction:column;
  overscroll-behavior:none;
  /* iPhone のノッチとホームバーに被らないように */
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--loop); outline-offset:2px; border-radius:4px}

/* ── 上 ───────────────────────────── */
header{
  flex:none; background:var(--surface); border-bottom:1px solid var(--rule);
  padding:10px 16px 8px; display:flex; flex-direction:column; gap:8px;
}
.kicker{
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
}
.kicker b{font-weight:600; letter-spacing:.06em; color:var(--ink-2)}
.kicker a{color:inherit; text-decoration:underline; text-underline-offset:2px; text-transform:none; letter-spacing:.02em}
.off{margin-left:auto; text-transform:none; letter-spacing:.02em; font-weight:600}
.off.ok{color:var(--ink-2)}
.off.ok::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--mark); margin-right:5px; vertical-align:1px}
.rows{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.lbl{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); flex:none}
.chips{display:flex; gap:4px; flex-wrap:wrap}
.segtitle{font-size:11.5px; color:var(--ink-2); letter-spacing:.01em}
.chip{
  font-size:12px; font-weight:500; padding:5px 10px; border-radius:999px;
  border:1px solid var(--rule); background:var(--ground); color:var(--ink-2);
  font-variant-numeric:tabular-nums; line-height:1.1;
}
.chip[aria-pressed="true"]{background:var(--mark); border-color:var(--mark); color:var(--mark-ink); font-weight:600}

/* ── 本文 ─────────────────────────── */
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 0 10px}
.line{
  display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start;
  width:100%; text-align:left; padding:9px 16px 9px 10px;
  border-left:3px solid transparent; border-bottom:1px solid var(--rule);
}
.line:last-child{border-bottom:none}
.n{
  font-size:10px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums;
  padding-top:5px; text-align:right; letter-spacing:.02em;
}
.dur{display:block; font-weight:400; color:var(--ink-3); opacity:.75; font-size:9px; margin-top:2px}
.body{min-width:0}
.en,.ja{display:block}
.line [hidden]{display:none !important}
.en{font-family:var(--en); font-size:18px; line-height:1.5; letter-spacing:.005em}
.ja{font-family:var(--jp); font-size:13px; line-height:1.65; color:var(--ink-2); margin-top:4px}
.line.done .en,.line.done .ja{color:var(--ink-3)}
.line.now{background:var(--mark-soft); border-left-color:var(--mark)}
.line.now .en{color:var(--ink); font-weight:500}
.line.now .n{color:var(--ink-2)}
.line.mark-a,.line.mark-b{border-left-color:var(--loop)}
.tag{
  display:inline-block; font-size:9px; font-weight:700; letter-spacing:.08em;
  background:var(--loop); color:#fff; border-radius:3px; padding:1px 4px; margin-right:6px;
  vertical-align:2px;
}
.line.inrange{background:var(--loop-soft)}
.line.inrange.now{background:var(--mark-soft)}
.veil{filter:blur(4.5px); opacity:.55; user-select:none}
/* かたまりの区切り。区切りが「かたまり」のときだけ / を見せ、今のかたまりを濃く塗る */
.sl{display:none; color:var(--ink-3); font-weight:400}
main.slashes .sl{display:inline}
.ck{border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone}
main.slashes .ck.on{background:var(--mark); color:var(--mark-ink); padding:0 2px}

/* ── 下 ───────────────────────────── */
footer{
  flex:none; background:var(--surface); border-top:1px solid var(--rule);
  padding:8px 16px 10px; display:flex; flex-direction:column; gap:8px;
}
.hint{font-size:11px; color:var(--ink-3); min-height:14px; line-height:1.3}
.hint strong{color:var(--loop); font-weight:600}
.gapcount{font-size:12px; color:var(--loop); font-variant-numeric:tabular-nums; min-width:5.5em}
.seekrow{display:flex; align-items:center; gap:10px}
.t{font-size:11px; color:var(--ink-2); font-variant-numeric:tabular-nums; flex:none; letter-spacing:.02em}
input[type=range]{flex:1; min-width:0; accent-color:var(--mark); height:20px}
.transport{display:flex; align-items:center; gap:8px}
.tbtn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--rule);
  background:var(--ground); display:grid; place-items:center; flex:none;
}
.tbtn svg{width:17px; height:17px; fill:var(--ink)}
#play{width:50px; height:50px; background:var(--ink); border-color:var(--ink)}
#play svg{width:20px; height:20px; fill:var(--ground)}
.spacer{flex:1}
.settings{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.settings .chip{padding:4px 9px; font-size:11px}
/* ラベルとボタンを1組にして、折り返すときは一緒に下の行へ */
.grp{display:inline-flex; align-items:center; gap:8px}
#reveal[aria-pressed="true"]{background:var(--loop); border-color:var(--loop); color:#fff}
@media (max-width:420px){ .en{font-size:17px} }
</style>
</head>
<body>

<header>
  <div class="kicker"><b id="speaker"></b><span id="talkinfo"></span><a class="src" id="src" href="#" target="_blank" rel="noopener">出典 CC BY-NC-ND 4.0</a><span class="off" id="offline"></span></div>
  <div class="rows">
    <span class="lbl">トーク</span>
    <div class="chips" id="talks"></div>
  </div>
  <div class="rows">
    <span class="lbl">区間</span>
    <div class="chips" id="segs"></div>
    <span class="segtitle" id="segtitle"></span>
  </div>
  <div class="rows">
    <span class="lbl">字幕</span>
    <div class="chips" id="subs">
      <button class="chip" data-v="off">なし</button>
      <button class="chip" data-v="en">英</button>
      <button class="chip" data-v="ja">日</button>
      <button class="chip" data-v="both">英日</button>
    </div>
  </div>
  <div class="rows">
    <span class="lbl">練習</span>
    <div class="chips" id="steps">
      <button class="chip" data-v="imi">① 意味</button>
      <button class="chip" data-v="rep">② リピート</button>
      <button class="chip" data-v="ovl">③ 重ねる</button>
      <button class="chip" data-v="sha">④ シャドー</button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer>
  <div class="hint" id="hint"></div>
  <div class="seekrow">
    <span class="t" id="tnow">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="再生位置">
    <span class="t" id="tend">0:00</span>
  </div>
  <div class="transport">
    <button class="tbtn" id="prev" aria-label="前の文"><svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm3 6l8-6v12z"/></svg></button>
    <button class="tbtn" id="play" aria-label="再生"><svg viewBox="0 0 24 24" id="playicon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="tbtn" id="next" aria-label="次の文"><svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg></button>
    <span class="gapcount" id="gapcount"></span>
    <span class="spacer"></span>
    <button class="chip" id="reveal" aria-pressed="false">今の文を見る</button>
  </div>
  <div class="settings">
    <span class="lbl">繰り返し</span>
    <div class="chips" id="loops">
      <button class="chip" data-v="off">流す</button>
      <button class="chip" data-v="step">止めて進む</button>
      <button class="chip" data-v="one" id="loop-one">1文</button>
      <button class="chip" data-v="ab">A–B</button>
      <button class="chip" data-v="seg">区間</button>
      <button class="chip" data-v="all">全体</button>
    </div>
  </div>
  <div class="settings">
    <span class="lbl">区切り</span>
    <div class="chips" id="units">
      <button class="chip" data-v="文">文</button>
      <button class="chip" data-v="塊">かたまり</button>
    </div>
  </div>
  <div class="settings">
    <span class="lbl">速さ</span>
    <div class="chips" id="rates">
      <button class="chip" data-v="0.6">0.6×</button>
      <button class="chip" data-v="0.7">0.7×</button>
      <button class="chip" data-v="0.85">0.85×</button>
      <button class="chip" data-v="1">1×</button>
    </div>
    <span class="grp"><span class="lbl">間</span>
    <div class="chips" id="gaps">
      <button class="chip" data-v="0">なし</button>
      <button class="chip" data-v="1.5">1.5秒</button>
      <button class="chip" data-v="3">3秒</button>
      <button class="chip" data-v="auto">自動</button>
    </div></span>
  </div>
</footer>

<script>
const DATA = {"urban": {"話者": "Tim Urban", "題": "Inside the Mind of a Master Procrastinator", "年": 2016, "wpm": 162, "出典": "https://www.ted.com/talks/tim_urban_inside_the_mind_of_a_master_procrastinator", "音声": "audio/{n}.mp3", "区間": {"1": {"見出し": "レポートの先延ばし", "文": [{"s": 0.68, "e": 7.35, "en": "So in college, I was a government major, which means I had to write a lot of papers.", "ja": "大学では政治学を専攻していて、つまりレポートをたくさん書かないといけなかった。", "塊": [{"en": "So in college,", "s": 0.68, "e": 1.91}, {"en": "I was a government major,", "s": 1.91, "e": 5.11}, {"en": "which means I had to write", "s": 5.11, "e": 6.49}, {"en": "a lot of papers.", "s": 6.49, "e": 7.35}]}, {"s": 7.54, "e": 11.27, "en": "Now, when a normal student writes a paper, they might spread the work out a little like this.", "ja": "さて、普通の学生がレポートを書くときは、こんなふうに作業を少しずつ散らすと思う。", "塊": [{"en": "Now, when a normal student", "s": 7.54, "e": 8.99}, {"en": "writes a paper,", "s": 8.99, "e": 9.47}, {"en": "they might spread", "s": 9.47, "e": 9.99}, {"en": "the work out a little like this.", "s": 9.99, "e": 11.27}]}, {"s": 11.88, "e": 22.69, "en": "So, you know --  you get started maybe a little slowly, but you get enough done in the first week that, with some heavier days later on, everything gets done, things stay civil.", "ja": "最初はちょっとゆっくり始めるけど、最初の週にそれなりに進めておくから、後半に少し重い日があれば全部終わって、穏やかなまま済む。", "塊": [{"en": "So, you know --", "s": 11.88, "e": 12.83}, {"en": "you get started maybe a little slowly,", "s": 15.14, "e": 16.91}, {"en": "but you get enough", "s": 16.91, "e": 17.49}, {"en": "done in the first week", "s": 17.49, "e": 18.47}, {"en": "that, with some heavier days later on,", "s": 18.47, "e": 20.33}, {"en": "everything gets done,", "s": 20.58, "e": 21.65}, {"en": "things stay civil.", "s": 21.65, "e": 22.69}]}, {"s": 24.0, "e": 26.26, "en": "And I would want to do that like that.", "ja": "で、僕もそうやりたいと思っていた。", "塊": [{"en": "And I would want", "s": 24.0, "e": 25.11}, {"en": "to do that like that.", "s": 25.11, "e": 26.26}]}, {"s": 26.26, "e": 27.63, "en": "That would be the plan.", "ja": "それが計画だった。", "塊": [{"en": "That would be the plan.", "s": 26.26, "e": 27.63}]}, {"s": 27.56, "e": 34.31, "en": "I would have it all ready to go, but then, actually, the paper would come along, and then I would kind of do this.", "ja": "準備は万全にしておくんだけど、いざレポートが来ると、実際にはこうなる。", "塊": [{"en": "I would have it all ready", "s": 27.56, "e": 30.11}, {"en": "to go,", "s": 30.11, "e": 30.45}, {"en": "but then,", "s": 30.45, "e": 30.83}, {"en": "actually, the paper would come along,", "s": 30.83, "e": 32.97}, {"en": "and then I would kind of do this.", "s": 32.97, "e": 34.31}]}, {"s": 36.86, "e": 39.17, "en": "And that would happen every single paper.", "ja": "そしてそれが、どのレポートでも毎回起きた。", "塊": [{"en": "And that would happen every single paper.", "s": 36.86, "e": 39.17}]}, {"s": 39.68, "e": 45.89, "en": "But then came my 90-page senior thesis, a paper you're supposed to spend a year on.", "ja": "ところがそこへ、1年かけて書くはずの90ページの卒業論文がやってきた。", "塊": [{"en": "But then came my 90-page senior thesis,", "s": 39.68, "e": 43.57}, {"en": "a paper you're supposed", "s": 43.72, "e": 44.73}, {"en": "to spend a year on.", "s": 44.73, "e": 45.89}]}, {"s": 45.94, "e": 50.04, "en": "And I knew for a paper like that, my normal work flow was not an option.", "ja": "そういう論文では、いつものやり方は通用しないと分かっていた。", "塊": [{"en": "And I knew", "s": 45.94, "e": 46.73}, {"en": "for a paper like that,", "s": 46.73, "e": 47.67}, {"en": "my normal work flow", "s": 47.67, "e": 48.27}, {"en": "was not an option.", "s": 48.64, "e": 50.04}]}, {"s": 49.92, "e": 51.2, "en": "It was way too big a project.", "ja": "規模が大きすぎた。", "塊": [{"en": "It was way too big a project.", "s": 49.92, "e": 51.2}]}, {"s": 51.08, "e": 55.73, "en": "So I planned things out, and I decided I kind of had to go something like this.", "ja": "だから計画を立てて、こんなふうにやろうと決めた。", "塊": [{"en": "So I planned things out,", "s": 51.08, "e": 52.43}, {"en": "and I decided", "s": 52.43, "e": 52.97}, {"en": "I kind of had to go y does not know", "s": 149.59, "e": 150.97}, {"en": "what that is.", "s": 150.97, "e": 151.82}]}, {"s": 151.7, "e": 159.72, "en": "Which is why we have another guy in our brain, the Rational Decision-Maker, who gives us the ability to do things no other animal can do.", "ja": "だからこそ、脳にはもう一人いる。理性的な意思決定者。ほかのどんな動物にもできないことを、僕らにできるようにしてくれる存在だ。", "塊": [{"en": "Which is why", "s": 151.7, "e": 152.57}, {"en": "we have another guy in our brain,", "s": 152.57, "e": 153.91}, {"en": "the Rational Decision-Maker,", "s": 153.91, "e": 155.89}, {"en": "who gives us the ability", "s": 156.28, "e": 157.69}, {"en": "to do things", "s": 157.69, "e": 158.31}, {"en": "no other animal can do.", "s": 158.31, "e": 159.72}]}]}, "3": {"見出し": "パニック・モンスター", "文": [{"s": 0.0, "e": 1.94, "en": "We can visualize the future.", "ja": "僕らは未来を思い描ける。", "塊": [{"en": "We can visualize the future.", "s": 0.0, "e": 1.94}]}, {"s": 1.94, "e": 3.39, "en": "We can see the big picture.", "ja": "全体像を見渡せる。", "塊": [{"en": "We can see the big picture.", "s": 1.94, "e": 3.39}]}, {"s": 3.38, "e": 5.34, "en": "We can make long-term plans.", "ja": "長期的な計画を立てられる。", "塊": [{"en": "We can make long-term plans.", "s": 3.38, "e": 5.34}]}, {"s": 5.22, "e": 7.45, "en": "And he wants to take all of that into account.", "ja": "そして彼は、そのすべてを考慮に入れたい。", "塊": [{"en": "And he wants", "s": 5.22, "e": 5.77}, {"en": "to take all of that into account.", "s": 5.77, "e": 7.45}]}, {"s": 8.12, "e": 13.13, "en": "And he wants to just have us do whatever makes sense to be doing right now.", "ja": "今やるのが筋の通ることを、ただやらせたいと思っている。", "塊": [{"en": "And he wants", "s": 8.12, "e": 9.17}, {"en": "to just have us", "s": 9.17, "e": 10.17}, {"en": "do whatever makes sense", "s": 10.17, "e": 11.51}, {"en": "to be doing right now.", "s": 11.51, "e": 13.13}]}, {"s": 13.06, "e": 20.58, "en": "Now, sometimes it makes sense to be doing things that are easy and fun, like when you're having dinner or going to bed or enjoying well-earned leisure time.", "ja": "もちろん、楽で ot", "s": 38.22, "e": 39.59}, {"en": "of time in this orange zone,", "s": 39.59, "e": 41.35}, {"en": "an easy and fun", "s": 41.78, "e": 43.57}, {"en": "place that's entirely out", "s": 43.57, "e": 45.05}, {"en": "of the Makes Sense circle.", "s": 45.05, "e": 46.34}]}, {"s": 46.22, "e": 48.25, "en": "I call it the Dark Playground.", "ja": "僕はそこを「暗い遊び場」と呼んでいる。", "塊": [{"en": "I call it the Dark Playground.", "s": 46.22, "e": 48.25}]}, {"s": 51.18, "e": 57.34, "en": "Now, the Dark Playground is a place that all of you procrastinators out there know very well.", "ja": "暗い遊び場は、先延ばしするみなさんならよく知っている場所だ。", "塊": [{"en": "Now, the Dark Playground is a place", "s": 51.18, "e": 53.63}, {"en": "that all of you procrastinators out", "s": 53.63, "e": 55.59}, {"en": "there know very well.", "s": 55.59, "e": 57.34}]}, {"s": 57.3, "e": 62.19, "en": "It's where leisure activities happen at times when leisure activities are not supposed to be happening.", "ja": "本来なら娯楽をしているべきでない時間に、娯楽が行われる場所。", "塊": [{"en": "It's where leisure activities happen at times", "s": 57.3, "e": 59.57}, {"en": "when leisure activities are not supposed", "s": 59.57, "e": 61.39}, {"en": "to be happening.", "s": 61.39, "e": 62.19}]}, {"s": 62.34, "e": 72.31, "en": "The fun you have in the Dark Playground isn't actually fun, because it's completely unearned, and the air is filled with guilt, dread, anxiety, self-hatred -- all of those good procrastinator feelings.", "ja": "暗い遊び場で味わう楽しさは、実は楽しくない。まったく稼いだものではないし、空気は罪悪感、恐れ、不安、自己嫌悪で満ちている。先延ばしする人らしい、いい気分の数々だ。", "塊": [{"en": "The fun you have in the Dark Playground", "s": 62.34, "e": 64.41}, {"en": "isn't actually fun,", "s": 64.41, "e": 65.27}, {"en": "because it's completely unearned,", "s": 65.27, "e": 66.79}, {"en": "and the air is filled with guilt,", "s": 66.79, "e": 68.05}, {"en": "dread, anxiety,", "s": 68.24, "e": 69.69}, {"en": "self-hatred --", "s": 69.69, "e": 70.41}, {"en": "all of those good procrastinator feelings.", "s": 70.41, "e": 72.31}]}, {"s": 72.62, s": 105.28, "e": 107.19}, {"en": "anytime a deadline gets too close", "s": 108.08, "e": 109.67}, {"en": "or there's danger of public embarrassment,", "s": 109.67, "e": 111.45}, {"en": "a career disaster", "s": 111.45, "e": 112.67}, {"en": "or some other scary consequence.", "s": 112.67, "e": 114.17}]}, {"s": 114.1, "e": 118.48, "en": "And importantly, he's the only thing the Monkey is terrified of.", "ja": "そして重要なのは、サルが恐れている唯一の存在が彼だということ。", "塊": [{"en": "And importantly,", "s": 114.1, "e": 115.09}, {"en": "he's the only thing", "s": 115.16, "e": 116.63}, {"en": "the Monkey is terrified of.", "s": 116.63, "e": 118.48}]}, {"s": 118.36, "e": 128.13, "en": "Now, he became very relevant in my life pretty recently, because the people of TED reached out to me about six months ago and invited me to do a TED Talk.", "ja": "彼は最近、僕の人生でとても重要になった。半年ほど前にTEDの人たちから連絡が来て、TEDトークをしないかと誘われたからだ。", "塊": [{"en": "Now, he became", "s": 118.36, "e": 119.91}, {"en": "very relevant in my life pretty recently,", "s": 119.91, "e": 122.39}, {"en": "because the people of TED reached out", "s": 122.68, "e": 125.21}, {"en": "to me about six months ago", "s": 125.21, "e": 126.51}, {"en": "and invited me", "s": 126.51, "e": 127.15}, {"en": "to do a TED Talk.", "s": 127.15, "e": 128.13}]}, {"s": 133.14, "e": 135.36, "en": "Now, of course, I said yes.", "ja": "もちろん、僕は「はい」と答えた。", "塊": [{"en": "Now, of course,", "s": 133.14, "e": 134.47}, {"en": "I said yes.", "s": 134.47, "e": 135.36}]}, {"s": 135.34, "e": 139.21, "en": "It's always been a dream of mine to have done a TED Talk in the past.", "ja": "「過去にTEDトークをやったことがある」というのは、ずっと僕の夢だった。", "塊": [{"en": "It's always been a dream of mine", "s": 135.34, "e": 136.67}, {"en": "to have done", "s": 136.67, "e": 137.55}, {"en": "a TED Talk in the past.", "s": 137.55, "e": 139.21}]}, {"s": 150.22, "e": 154.36, "en": "But in the middle of all this excitement, the Rational Decision-Maker seemed to have something else on his mind.", "ja": "でもその興奮の真ん中で、理性的な意思決定者は何か別のこと rocrastinators.", "ja": "そう、みなさん全員が先延ばしする人だと思う。", "塊": [{"en": "That's right --", "s": 67.02, "e": 67.89}, {"en": "I think all of you are procrastinators.", "s": 67.9, "e": 70.39}]}, {"s": 70.84, "e": 83.81, "en": "Now, you might not all be a mess, like some of us,  and some of you may have a healthy relationship with deadlines, but remember: the Monkey's sneakiest trick is when the deadlines aren't there.", "ja": "僕らの一部ほどひどい状態ではないかもしれないし、締切と健全な関係を築いている人もいるかもしれない。でも覚えておいてほしい。サルのいちばん狡いやり口は、締切がないときに出てくる。", "塊": [{"en": "Now, you might", "s": 70.84, "e": 71.81}, {"en": "not all be a mess,", "s": 71.81, "e": 72.89}, {"en": "like some of us,", "s": 72.9, "e": 74.21}, {"en": "and some of you may", "s": 75.78, "e": 77.11}, {"en": "have a healthy relationship with deadlines,", "s": 77.11, "e": 78.97}, {"en": "but remember:", "s": 79.14, "e": 80.11}, {"en": "the Monkey's sneakiest trick", "s": 80.11, "e": 82.13}, {"en": "is when the deadlines aren't there.", "s": 82.13, "e": 83.81}]}, {"s": 84.14, "e": 85.96, "en": "Now, I want to show you one last thing.", "ja": "最後にひとつ、見てほしいものがある。", "塊": [{"en": "Now, I want", "s": 84.14, "e": 85.03}, {"en": "to show you one last thing.", "s": 85.03, "e": 85.96}]}, {"s": 85.96, "e": 88.97, "en": "I call this a Life Calendar.", "ja": "これを「人生カレンダー」と呼んでいる。", "塊": [{"en": "I call this a Life Calendar.", "s": 85.96, "e": 88.97}]}, {"s": 89.22, "e": 93.97, "en": "That's one box for every week of a 90-year life.", "ja": "90年の人生の、1週間につき1つのマス。", "塊": [{"en": "That's one box", "s": 89.22, "e": 90.75}, {"en": "for every week of a 90-year life.", "s": 90.75, "e": 93.97}]}, {"s": 94.2, "e": 99.37, "en": "That's not that many boxes, especially since we've already used a bunch of those.", "ja": "そんなに多くのマスじゃない。しかも、もうかなりの数を使ってしまっている。", "塊": [{"en": "That's not that many boxes,", "s": 94.2, "e": 96.21}, {"en": "especially since we've already", "s": 96.3, "e": 98.35}, {"en": "used a bunch of those.", "s": 98.35, "e": 99.37}]}, {"s": 99.34, "e": 104.95, "en": "So I think we need to all take a long, hard look at that calendar.", "ja": "だから僕らは全員、そのカレンダーを長く、真剣に見る必要があると思う。", "塊": [{"en": "So I think we need", "s": 99.34, "e": 101.25}, {"en": "to all take a long,", "s": 101.25, "e": 102.95}, {"en": "hard look at that calendar.", "s": 102.95, "e": 104.95}]}, {"s": 105.76, "e": 112.79, "en": "We need to think about what we're really procrastinating on, because everyone is procrastinating on something in life.", "ja": "自分が本当は何を先延ばしにしているのかを考える必要がある。誰もが人生の中で何かを先延ばしにしているから。", "塊": [{"en": "We need to think", "s": 105.76, "e": 107.01}, {"en": "about what we're really procrastinating on,", "s": 107.01, "e": 109.15}, {"en": "because everyone is procrastinating on something in life.", "s": 109.15, "e": 112.79}]}, {"s": 113.54, "e": 117.01, "en": "We need to stay aware of the Instant Gratification Monkey.", "ja": "すぐご褒美が欲しいサルの存在に、気づいていなければならない。", "塊": [{"en": "We need to stay", "s": 113.54, "e": 114.95}, {"en": "aware of the Instant Gratification Monkey.", "s": 114.95, "e": 117.01}]}, {"s": 118.38, "e": 121.21, "en": "That's a job for all of us.", "ja": "それは僕ら全員の仕事だ。", "塊": [{"en": "That's a job for all of us.", "s": 118.38, "e": 121.21}]}, {"s": 121.54, "e": 126.33, "en": "And because there's not that many boxes on there, it's a job that should probably start today.", "ja": "そして、マスはそんなに多くないから、たぶん今日から始めるべき仕事だ。", "塊": [{"en": "And because there's not that many", "s": 121.54, "e": 123.35}, {"en": "boxes on there,", "s": 123.35, "e": 123.95}, {"en": "it's a job", "s": 123.95, "e": 124.39}, {"en": "that should probably start today.", "s": 124.39, "e": 126.33}]}, {"s": 126.42, "e": 130.19, "en": "Well, maybe not today, but ...", "ja": "まあ、今日じゃないかもしれないけど…", "塊": [{"en": "Well, maybe not today,", "s": 126.42, "e": 129.01}, {"en": "but ...", "s": 129.08, "e": 130.19}]}, {"s": 130.74, "e": 131.89, "en": "You know.", "ja": "ね。", "塊": [{"en": "You know.", "s": 130.74, "e": 131.89}]}, {"s": 131.98, "e": 133.89, "en": "Sometime soon.", "ja": "近いうちに。", "塊": [{"en": "Sometime soon.", "s": 131.98, "e": 133.89}]}, {"s": 134.28, "e": 135.53, "en": "Thank you.", "ja": "ありがとう。", "塊": [{"en": "Thank you.", "s": 134.28, "e": 135.53}]}]}}}, "treasure": {"話者": "Julian Treasure", "題": "How to speak so that people want to listen", "年": 2013, "wpm": 171, "出典": "https://www.ted.com/talks/julian_treasure_how_to_speak_so_that_people_want_to_listen", "音声": "audio/treasure/{n}.mp3", "区間": {"1": {"見出し": "はじめに・悪い癖1〜3", "文": [{"s": 0.8, "e": 4.71, "en": "The human voice: It's the instrument we all play.", "ja": "人間の声。それは、誰もが演奏している楽器だ。", "塊": [{"en": "The human voice:", "s": 0.8, "e": 2.17}, {"en": "It's the instrument we all play.", "s": 2.84, "e": 4.71}]}, {"s": 5.44, "e": 7.61, "en": "It's the most powerful sound in the world, probably.", "ja": "たぶん、世界でいちばん力のある音だと思う。", "塊": [{"en": "It's the most powerful", "s": 5.44, "e": 6.67}, {"en": "sound in the world, probably.", "s": 6.67, "e": 7.61}]}, {"s": 7.61, "e": 10.63, "en": "It's the only one that can start a war or say \"I love you.\"", "ja": "戦争を始めることも、「愛してる」と伝えることもできる、ただ一つの音だ。", "塊": [{"en": "It's the only one that can start", "s": 7.61, "e": 8.85}, {"en": "a war or say \"I love you.\"", "s": 8.85, "e": 10.63}]}, {"s": 10.8, "e": 15.05, "en": "And yet many people have the experience that when they speak, people don't listen to them.", "ja": "それなのに多くの人が、自分が話しても人に聞いてもらえない、という経験をしている。", "塊": [{"en": "And yet many people have the experience", "s": 10.8, "e": 12.67}, {"en": "that when they speak,", "s": 12.67, "e": 13.63}, {"en": "people don't listen to them.", "s": 13.63, "e": 15.05}]}, {"s": 15.26, "e": 16.38, "en": "And why is that?", "ja": "それはなぜだろう？", "塊": [{"en": "And why is that?", "s": 15.26, "e": 16.38}]}, {"s": 16.38, "e": 20.31, "en": "How can we speak powerfully to make change in the world?", "ja": "どうすれば力強く話して、世界に変化を起こせるのか？", "塊": [{"en": "How can we speak powerfully", "s": 16.38, "e": 17.97}, {"en": "to make change in the world?", "s": 17.97, "e": 20.31}]}, {"s": 20.42, "e": 24.16, "en": "What I'd like to suggest, there are a number of habits that we need to move away from.", "ja": "私が提案したいのは、やめるべき習慣がいくつかある、ということだ。", "塊": [{"en": "What I'd like to suggest,", "s": 20.42, "e": 21.81}, {"en": "there are a number of habits", "s": 21.81, "e": 23.09}, {"en": "that we need to move away from.", "s": 23.09, "e": 24.16}]}, {"s": 24.16, "e": 28.35, "en": "I've assembled for your pleasure here seven deadly sins of speaking.", "ja": "そこで皆さんのために、話し方の「七つの大罪」をまとめてみた。", "塊": [{"en": "I've assembled for your pleasure", "s": 24.16, "e": 26.51}, {"en": "here seven deadly sins of speaking.", "s": 26.51, "e": 28.35}]}, {"s": 28.35, "e": 35.99, "en": "I'm not pretending this is an exhaustive list, but these seven, I think, are pretty large habits that we can all fall into.", "ja": "これで全部だと言うつもりはないけど、この7つは誰もがはまりがちな、かなり大きな習慣だと思う。", "塊": [{"en": "I'm not pretending", "s": 28.35, "e": 29.49}, {"en": "this is an exhaustive list,", "s": 29.49, "e": 30.75}, {"en": "but these seven,", "s": 30.75, "e": 32.29}, {"en": "I think,", "s": 32.29, "e": 32.63}, {"en": "are pretty large", "s": 32.63, "e": 33.53}, {"en": "habits that we can all fall into.", "s": 33.86, "e": 35.99}]}, {"s": 35.99, "e": 38.37, "en": "First, gossip.", "ja": "1つ目は、ゴシップ（陰口）。", "塊": [{"en": "First, gossip.", "s": 35.99, "e": 38.37}]}, {"s": 38.84, "e": 41.25, "en": "Speaking ill of somebody who's not present.", "ja": "その場にいない人の悪口を言うこと。", "塊": [{"en": "Speaking ill of somebody who's not present.", "s": 38.84, "e": 41.25}]}, {"s": 41.48, "e": 47.99, "en": "Not a nice habit, and we know perfectly well the person gossiping, five minutes later, will be gossiping about us.", "ja": "いい習慣じゃないし、陰口を言っているその人が5分後には私たちの陰口を言うことも、よく分かっている。", "塊": [{"en": "Not a nice habit,", "s": 41.48, "e": 42.77}, {"en": "and we know perfectly", "s": 42.77, "e": 43.67}, {"en": "well the person gossiping,", "s": 43.67, "e": 44.77}, {"en": "five minutes later,", "s": 44.77, "e": 45.87}, {"en": "will be gossiping about us.", "s": 45.87, "e": 47.99}]}, {"s": 48.64, "e": 50.19, "en": "Second, judging.", "ja": "2つ目は、決めつけ（judging）。", "塊": [{"en": "Second, judging.", "s": 48.64, "e": 50.19}]}, {"s": 50.26, "e": 58.89, "en": "We know people who are like this in conversation, and it's very hard to listen to somebody if you know that you're being judged and found wanting at the same time.", "ja": "会話でこういう人っているよね。自分が評価されて、しかも足りないと思われているのが分かっていたら、その人の話を聞くのはとても難しい。", "塊": [{"en": "We know people", "s": 50.26, "e": 51.31}, {"en": "who are like this in conversation,", "s": 51.31, "e": 52.91}, {"en": "and it's very hard to listen", "s": 52.91, "e": 54.05}, {"en": "to somebody if you know", "s": 54.05, "e": 55.75}, {"en": "that you're being judged", "s": 55.75, "e": 56.65}, {"en": "and found wanting at the same time.", "s": 56.65, "e": 58.89}]}, {"s": 59.64, "e": 60.81, "en": "Third, negativity.", "ja": "3つ目は、ネガティブさ。", "塊": [{"en": "Third, negativity.", "s": 59.64, "e": 60.81}]}, {"s": 61.24, "e": 62.74, "en": "You can fall into this.", "ja": "これには誰でも陥りうる。", "塊": [{"en": "You can fall into this.", "s": 61.24, "e": 62.74}]}, {"s": 62.74, "e": 66.55, "en": "My mother, in the last years of her life, became very negative, and it's hard to listen.", "ja": "私の母は晩年とてもネガティブになって、話を聞くのがつらかった。", "塊": [{"en": "My mother,", "s": 62.74, "e": 63.41}, {"en": "in the last years of her life,", "s": 63.41, "e": 64.55}, {"en": "became very negative,", "s": 64.55, "e": 65.75}, {"en": "and it's hard to listen.", "s": 65.75, "e": 66.55}]}, {"s": 66.55, "e": 71.49, "en": "I remember one day, I said to her, \"It's October 1 today,\" and she said, \"I know, isn't it dreadful?\"", "ja": "ある日、母に「今日は10月1日だね」と言ったら、「そうね、ひどいでしょう？」と返されたのを覚えている。", "塊": [{"en": "I remember one day,", "s": 66.55, "e": 67.53}, {"en": "I said to her,", "s": 67.53, "e": 68.11}, {"en": "\"It's October 1 today,\" and she said,", "s": 68.11, "e": 70.25}, {"en": "\"I know,", "s": 70.25, "e": 70.59}, {"en": "isn't it dreadful?\"", "s": 70.59, "e": 71.49}]}, {"s": 74.02, "e": 76.75, "en": "It's hard to listen when somebody's that negative.", "ja": "人がそこまでネガティブだと、聞くのはつらい。", "塊": [{"en": "It's hard to listen", "s": 74.02, "e": 75.37}, {"en": "when somebody's that negative.", "s": 75.37, "e": 76.75}]}]}, "2": {"見出し": "悪い癖4〜7", "文": [{"s": 0.8, "e": 3.71, "en": "And another form of negativity, complaining.", "ja": "そしてネガティブさのもう1つの形が、不平不満だ。", "塊": [{"en": "And another form of negativity, complaining.", "s": 0.8, "e": 3.71}]}, {"s": 3.88, "e": 7.03, "en": "Well, this is the national art of the U.K.", "ja": "まあ、これはイギリスのお家芸だ。", "塊": [{"en": "Well, this is the national", "s": 3.88, "e": 5.65}, {"en": "art of the U.K.", "s": 5.65, "e": 7.03}]}, {"s": 7.46, "e": 9.1, "en": "It's our national sport.", "ja": "国民的スポーツと言ってもいい。", "塊": [{"en": "It's our national sport.", "s": 7.46, "e": 9.1}]}, {"s": 9.1, "e": 14.44, "en": "We complain about the weather, sport, about politics, about everything, but actually, complaining is viral misery.", "ja": "天気にも、スポーツにも、政治にも、何にでも文句を言う。でも実は、不満は人に不幸をうつしていくものだ。", "塊": [{"en": "We complain about the weather,", "s": 9.1, "e": 10.25}, {"en": "sport, about politics,", "s": 10.4, "e": 11.59}, {"en": "about everything,", "s": 11.59, "e": 12.19}, {"en": "but actually,", "s": 12.19, "e": 12.91}, {"en": "complaining is viral misery.", "s": 12.91, "e": 14.44}]}, {"s": 14.44, "e": 17.61, "en": "It's not spreading sunshine and lightness in the world.", "ja": "世界に明るさや軽やかさを広げてはくれない。", "塊": [{"en": "It's not spreading sunshine", "s": 14.44, "e": 16.17}, {"en": "and lightness in the world.", "s": 16.17, "e": 17.61}]}, {"s": 18.92, "e": 19.85, "en": "Excuses.", "ja": "言い訳。", "塊": [{"en": "Excuses.", "s": 18.92, "e": 19.85}]}, {"s": 19.96, "e": 21.68, "en": "We've all met this guy.", "ja": "こういう人には誰でも会ったことがある。", "塊": [{"en": "We've all met this guy.", "s": 19.96, "e": 21.68}]}, {"s": 21.68, "e": 23.18, "en": "Maybe we've all been this guy.", "ja": "自分がこういう人だったこともあるかもしれない。", "塊": [{"en": "Maybe we've all been this guy.", " [{"en": "But is there a positive way", "s": 0.8, "e": 2.81}, {"en": "to think about this?", "s": 2.81, "e": 3.52}]}, {"s": 3.52, "e": 4.89, "en": "Yes, there is.", "ja": "ある。", "塊": [{"en": "Yes, there is.", "s": 3.52, "e": 4.89}]}, {"s": 4.9, "e": 16.33, "en": "I'd like to suggest that there are four really powerful cornerstones, foundations, that we can stand on if we want our speech to be powerful and to make change in the world.", "ja": "話を力強くして世界に変化を起こしたいなら、その足場にできる、とても強い4つの礎、土台がある、と提案したい。", "塊": [{"en": "I'd like to suggest", "s": 4.9, "e": 6.53}, {"en": "that there are four really powerful cornerstones,", "s": 6.53, "e": 9.57}, {"en": "foundations, that we can stand on if we want", "s": 9.57, "e": 12.73}, {"en": "our speech to be powerful", "s": 12.73, "e": 14.27}, {"en": "and to make change in the world.", "s": 14.27, "e": 16.33}]}, {"s": 17.2, "e": 19.09, "en": "Fortunately, these things spell a word.", "ja": "うまいことに、この4つの頭文字で1つの単語になる。", "塊": [{"en": "Fortunately, these things spell a word.", "s": 17.2, "e": 19.09}]}, {"s": 19.09, "e": 22.31, "en": "The word is \"hail,\" and it has a great definition as well.", "ja": "その単語は hail で、意味もいい。", "塊": [{"en": "The word is \"hail,\"", "s": 19.09, "e": 20.37}, {"en": "and it has a great definition", "s": 20.37, "e": 21.67}, {"en": "as well.", "s": 21.67, "e": 22.31}]}, {"s": 22.31, "e": 25.5, "en": "I'm not talking about the stuff that falls from the sky and hits you on the head.", "ja": "空から降ってきて頭に当たる、あの「ひょう」のことではない。", "塊": [{"en": "I'm not talking about the stuff", "s": 22.31, "e": 23.61}, {"en": "that falls from the sky", "s": 23.61, "e": 24.55}, {"en": "and hits you on the head.", "s": 24.55, "e": 25.5}]}, {"s": 25.5, "e": 33.57, "en": "I'm talking about this definition, to greet or acclaim enthusiastically, which is how I think our words will be received if we stand on these four things.", "ja": "こっちの意味、つまり「熱烈に迎える、歓呼する」のことだ。この4つを足場にすれば、私たちの言葉はそんなふうに受け止めてもらえると思う。", "塊": [{"en": "I'm talking about this definition,", "s": 25.5, "e": 27.25}, {"en": "to greet or acclaim enthusiastically,", "s": 27.25, "e": 29.95}, {"en": "which is how I think", "s": 29.95, "e": 30.53}, {"en": "our words will be received", "s": 30.53, "e": 31.87}, {"en": "if we stand on these four things.", "s": 31.87, "e": 33.57}]}, {"s": 33.57, "e": 34.77, "en": "So what do they stand for?", "ja": "では、それぞれ何の頭文字だろう？", "塊": [{"en": "So what do they stand for?", "s": 33.57, "e": 34.77}]}, {"s": 35.1, "e": 36.51, "en": "See if you can guess.", "ja": "当ててみてほしい。", "塊": [{"en": "See if you can guess.", "s": 35.1, "e": 36.51}]}, {"s": 36.88, "e": 42.87, "en": "The H, honesty, of course, being true in what you say, being straight and clear.", "ja": "H は honesty（正直さ）。もちろん、言うことに嘘がなく、まっすぐで分かりやすいこと。", "塊": [{"en": "The H,", "s": 36.88, "e": 37.83}, {"en": "honesty, of course,", "s": 38.04, "e": 39.53}, {"en": "being true in what you say,", "s": 40.02, "e": 41.75}, {"en": "being straight and clear.", "s": 41.75, "e": 42.87}]}, {"s": 43.18, "e": 46.93, "en": "The A is authenticity, just being yourself.", "ja": "A は authenticity（自分らしさ）。ただ自分のままでいること。", "塊": [{"en": "The A is authenticity,", "s": 43.18, "e": 44.67}, {"en": "just being yourself.", "s": 45.18, "e": 46.93}]}, {"s": 47.02, "e": 52.05, "en": "A friend of mine described it as standing in your own truth, which I think is a lovely way to put it.", "ja": "友人はこれを「自分の真実の上に立つこと」と表現していて、素敵な言い方だと思う。", "塊": [{"en": "A friend of mine", "s": 47.02, "e": 48.05}, {"en": "described it as standing in your own", "s": 48.05, "e": 49.89}, {"en": "truth, which I think", "s": 49.89, "e": 50.85}, {"en": "is a lovely way to put it.", "s": 50.85, "e": 52.05}]}, {"s": 52.22, "e": 58.41, "en": "The I is integrity, being your word, actually doing what you say, and being somebody people can trust.", "ja": "I は integrity（誠実さ）。約束を守ること、言ったことを実際にやること、人に信頼される人であること。", "塊": [{"en": "The I is integrity,", "s": 52.22, "e": 53.79}, {"en": "being your word,", "s": 54.22, "e": 55.31}, {"en": "actually doing what you say,", "s": 55.31, "e": 56.59}, {"en": "and being somebody people can trust.", "s": 56.59, "e": 58.41}]}, {"s": 58.78, "e": 61.27, "en": "And the L is love.", "ja": "そして L は love（愛）。", "塊": [{"en": "And the L is love.", "s": 58.78, "e": 61.27}]}, {"s": 61.66, "e": 67.58, "en": "I don't mean romantic love, but I do mean wishing people well, for two reasons.", "ja": "恋愛の愛ではなくて、人の幸せを願うという意味だ。理由は2つある。", "塊": [{"en": "I don't mean romantic love,", "s": 61.66, "e": 63.55}, {"en": "but I do mean wishing people well,", "s": 63.66, "e": 66.01}, {"en": "for two reasons.", "s": 66.58, "e": 67.58}]}, {"s": 67.58, "e": 70.8, "en": "First of all, I think absolute honesty may not be what we want.", "ja": "まず、完全な正直さは、私たちが望むものではないかもしれないと思う。", "塊": [{"en": "First of all,", "s": 67.58, "e": 68.29}, {"en": "I think absolute honesty", "s": 68.29, "e": 69.85}, {"en": "may not be what we want.", "s": 69.85, "e": 70.8}]}, {"s": 70.8, "e": 72.81, "en": "I mean, my goodness, you look ugly this morning.", "ja": "だって、「うわ、今朝はひどい顔だね」とか。", "塊": [{"en": "I mean,", "s": 70.8, "e": 71.13}, {"en": "my goodness,", "s": 71.13, "e": 71.53}, {"en": "you look ugly this morning.", "s": 71.53, "e": 72.81}]}, {"s": 74.26, "e": 76.13, "en": "Perhaps that's not necessary.", "ja": "そこまでは言わなくていいだろう。", "塊": [{"en": "Perhaps that's not necessary.", "s": 74.26, "e": 76.13}]}, {"s": 77.2, "e": 80.02, "en": "Tempered with love, of course, honesty is a great thing.", "ja": "愛で和らげてあれば、もちろん正直さはすばらしいものだ。", "塊": [{"en": "Tempered with love,", "s": 77.2, "e": 78.39}, {"en": "of course,", "s": 78.39, "e": 78.81}, {"en": "honesty is a great thing.", "s": 78.81, "e": 80.02}]}, {"s": 80.02, "e": 85.85, "en": "But also, if you're really wishing somebody well, it's very hard to judge them at the same time.", "ja": "それに、本当に誰かの幸せを願っていたら、同時にその人を決めつけるのはとても難しい。", "塊": [{"en": "But also,", "s": 80.02, "e": 81.03}, {"en": "if you're really wishing somebody well,", "s": 81.04, "e": 83.17}, {"en": "it's very hard to judge them", "s": 83.18, "e": 84.97}, {"en": "at the same time.", "s": 84.97, "e": 85.85}]}, {"s": 85.92, "e": 89.39, "en": "I'm not even sure you can do those two things simultaneously.", "ja": "その2つを同時にできるのかすら、怪しいと思う。", "塊": [{"en": "I'm not even sure", "s": 85.92, "e": 87.11}, {"en": "you can do those two things simultaneously.", "s": 87.11, "e": 89.39}]}, {"s": 89.9, "e": 91.05, "en": "So hail.", "ja": "というわけで、hail だ。", "塊": [{"en": "So hail.", "s": 89.9, "e": 91.05}]}]}, "4": {"見出し": "声の道具：register と timbre", "文": [{"s": 0.8, "e": 6.04, "en": "Also, now that's what you say, and it's like the old song, it is what you say, it's also the way that you say it.", "ja": "さて、ここまでは何を言うかの話だった。古い歌にもあるように、大事なのは何を言うかだけじゃなく、どう言うかでもある。", "塊": [{"en": "Also, now that's what you say,", "s": 0.8, "e": 2.71}, {"en": "and it's like the old song,", "s": 2.71, "e": 3.71}, {"en": "it is what you say,", "s": 3.71, "e": 4.51}, {"en": "it's also the way", "s": 4.51, "e": 5.53}, {"en": "that you say it.", "s": 5.53, "e": 6.04}]}, {"s": 6.04, "e": 8.25, "en": "You have an amazing toolbox.", "ja": "皆さんは、すばらしい道具箱を持っている。", "塊": [{"en": "You have an amazing toolbox.", "s": 6.04, "e": 8.25}]}, {"s": 8.25, "e": 13.25, "en": "This instrument is incredible, and yet this is a toolbox that very few people have ever opened.", "ja": "この楽器はすごいものなのに、この道具箱を開けたことがある人はほとんどいない。", "塊": [{"en": "This instrument is incredible,", "s": 8.25, "e": 9.83}, {"en": "and yet this is a toolbox", "s": 9.83, "e": 11.41}, {"en": "that very few people have ever opened.", "s": 11.41, "e": 13.25}]}, {"s": 13.28, "e": 21.23, "en": "I'd like to have a little rummage in there with you now and just pull a few tools out that you might like to take away and play with, which will increase the power of your speaking.", "ja": "今から皆さんと一緒に少し中をあさって、持ち帰って試してみたくなるような道具をいくつか取り出したい。どれも話す力を強めてくれる。", "塊": [{"en": "I'd like to have a little rummage in there", "s": 13.28, "e": 15.21}, {"en": "with you now", "s": 15.21, "e": 15.93}, {"en": "and just pull a few tools out", "s": 15.93, "e": 17.15}, {"en": "that you might like to take away", "s": 17.15, "e": 18.31}, {"en": "and play with,", "s": 18.31, "e": 18.91}, {"en": "which will increase the power", "s": 18.98, "e": 20.49}, {"en": "of your speaking.", "s": 20.49, "e": 21.23}]}, {"s": 22.1, "e": 23.53, "en": "Register, for example.", "ja": "たとえば、声域（register）。", "塊": [{"en": "Register, for example.", "s": 22.1, "e": 23.53}]}, {"s": 24.02, "e": 29.93, "en": "Now, falsetto register may not be very useful most of the time, but there's a register in between.", "ja": "裏声の声域はたいてい役に立たないかもしれないけど、その間にも声域がある。", "塊": [{"en": "Now, falsetto register may", "s": 24.02, "e": 25.87}, {"en": "not be very useful", "s": 25.87, "e": 26.77}, {"en": "most of the time,", "s": 26.77, "e": 27.75}, {"en": "but there's a register in between.", "s": 27.8, "e": 29.93}]}, {"s": 29.93, "e": 33.02, "en": "I'm not going to get very technical about this for any of you who are voice coaches.", "ja": "ボイストレーナーの方もいるだろうけど、専門的な話はしない。", "塊": [{"en": "I'm not going", "s": 29.93, "e": 30.71}, {"en": "to get very technical", "s": 30.71, "e": 31.37}, {"en": "about this for any of you who are voice coaches.", "s": 31.37, "e": 33.02}]}, {"s": 33.02, "e": 34.84, "en": "You can locate your voice, however.", "ja": "ただ、声をどこから出すかは選べる。", "塊": [{"en": "You can locate your voice, however.", "s": 33.02, "e": 34.84}]}, {"s": 34.84, "e": 37.66, "en": "So if I talk up here in my nose, you can hear the difference.", "ja": "たとえば上の方、鼻で話すと、違いが聞こえると思う。", "塊": [{"en": "So if I talk up", "s": 34.84, "e": 36.13}, {"en": "here in my nose,", "s": 36.13, "e": 36.97}, {"en": "you can hear the difference.", "s": 36.97, "e": 37.66}]}, {"s": 37.66, "e": 42.27, "en": "If I go down here in my throat, which is where most of us speak from most of the time.", "ja": "下の方、喉で話すと、こう。たいていの人は、ほとんどいつもここから話している。", "塊": [{"en": "If I go down", "s": 37.66, "e": 38.49}, {"en": "here in my throat,", "s": 38.49, "e": 39.27}, {"en": "which is where most of us speak", "s": 39.28, "e": 40.99}, {"en": "from most of the time.", "s": 40.99, "e": 42.27}]}, {"s": 42.6, "e": 46.72, "en": "But if you want weight, you need to go down here to the chest.", "ja": "でも重みを出したいなら、もっと下、胸まで下げる必要がある。", "塊": [{"en": "But if you want weight,", "s": 42.6, "e": 44.33}, {"en": "you need to go down here", "s": 44.42, "e": 46.03}, {"en": "to the chest.", "s": 46.03, "e": 46.72}]}, {"s": 46.72, "e": 47.87, "en": "You hear the difference?", "ja": "違いが聞こえる？", "塊": [{"en": "You hear the difference?", "s": 46.72, "e": 47.87}]}, {"s": 48.2, "e": 57.39, "en": "We vote for politicians with lower voices, it's true, because we associate depth with power and with authority.", "ja": "私たちは声の低い政治家に投票する。本当の話だ。声の深さを、力や権威と結びつけるからだ。", "塊": [{"en": "We vote for politicians with lower voices,", "s": 48.2, "e": 51.41}, {"en": "it's true,", "s": 51.41, "e": 52.35}, {"en": "because we associate depth with power", "s": 52.6, "e": 55.51}, {"en": "and with authority.", "s": 55.51, "e": 57.39}]}, {"s": 58.16, "e": 59.43, "en": "That's register.", "ja": "これが声域。", "塊": [{"en": "That's register.", "s": 58.16, "e": 59.43}]}, {"s": 60.1, "e": 61.17, "en": "Then we have timbre.", "ja": "次は、音色（timbre）。", "塊": [{"en": "Then we have timbre.", "s": 60.1, "e": 61.17}]}, {"s": 61.28, "e": 62.86, "en": "It's the way your voice feels.", "ja": "声の手ざわりのことだ。", "塊": [{"en": "It's the way your voice feels.", "s": 61.28, "e": 62.86}]}, {"s": 62.86, "e": 69.63, "en": "Again, the research shows that we prefer voices which are rich, smooth, warm, like hot chocolate.", "ja": "これも研究で分かっていて、私たちはホットチョコレートみたいに、豊かで、なめらかで、温かい声を好む。", "塊": [{"en": "Again, the research shows", "s": 62.86, "e": 64.43}, {"en": "that we prefer voices", "s": 64.43, "e": 65.41}, {"en": "which are rich,", "s": 65.41, "e": 66.19}, {"en": "smooth, warm,", "s": 66.34, "e": 67.99}, {"en": "like hot chocolate.", "s": 67.99, "e": 69.63}]}, {"s": 70.18, "e": 75.13, "en": "Well if that's not you, that's not the end of the world, because you can train.", "ja": "もし自分がそうじゃなくても、この世の終わりではない。鍛えられるからだ。", "塊": [{"en": "Well if that's not you,", "s": 70.18, "e": 71.77}, {"en": "that's not the end of the world,", "s": 71.8, "e": 73.79}, {"en": "because you can train.", "s": 73.79, "e": 75.13}]}, {"s": 75.24, "e": 76.4, "en": "Go and get a voice coach.", "ja": "ボイストレーナーにつくといい。", "塊": [{"en": "Go and get a voice coach.", "s": 75.24, "e": 76.4}]}, {"s": 76.4, "e": 82.83, "en": "And there are amazing things you can do with breathing, with posture, and with exercises to improve the timbre of your voice.", "ja": "呼吸や姿勢、トレーニングで、声の音色をよくするために驚くほどいろいろなことができる。", "塊": [{"en": "And there are amazing", "s": 76.4, "e": 77.71}, {"en": "things you can do with breathing,", "s": 77.71, "e": 78.79}, {"en": "with posture,", "s": 78.79, "e": 79.45}, {"en": "and with exercises", "s": 79.45, "e": 80.65}, {"en": "to improve the timbre of your voice.", "s": 80.65, "e": 82.83}]}]}, "5": {"見出し": "prosody・pace・pitch・volume", "文": [{"s": 0.8, "e": 1.89, "en": "Then prosody.", "ja": "次は、抑揚（prosody）。", "塊": [{"en": "Then prosody.", "s": 0.8, "e": 1.89}]}, {"s": 1.89, "e": 2.89, "en": "I love prosody.", "ja": "私は抑揚が大好きだ。", "塊": [{"en": "I love prosody.", "s": 1.89, "e": 2.89}]}, {"s": 2.89, "e": 7.04, "en": "This is the sing-song, the meta-language that we use in order to impart meaning.", "ja": "これは歌うような調子のことで、意味を伝えるために使う、言葉の上の言葉だ。", "塊": [{"en": "This is the sing-song,", "s": 2.89, "e": 3.91}, {"en": "the meta-language that we use in order", "s": 3.91, "e": 5.95}, {"en": "to impart meaning.", "s": 5.95, "e": 7.04}]}, {"s": 7.04, "e": 9.55, "en": "It's root one for meaning in conversation.", "ja": "会話で意味を伝える一番の手段だ。", "塊": [{"en": "It's root one for meaning in conversation.", "s": 7.04, "e": 9.55}]}, {"s": 9.82, "e": 16.11, "en": "People who speak all on one note are really quite hard to listen to if they don't have any prosody at all.", "ja": "抑揚がまったくなく、ずっと同じ高さで話す人の話は、本当にかなり聞きにくい。", "塊": [{"en": "People who speak", "s": 9.82, "e": 10.81}, {"en": "all on one note", "s": 10.81, "e": 11.99}, {"en": "are really quite hard to listen", "s": 11.99, "e": 13.75}, {"en": "to if they don't have any prosody", "s": 13.75, "e": 15.55}, {"en": "at all.", "s": 15.55, "e": 16.11}]}, {"s": 16.28, "e": 21.01, "en": "That's where the word \"monotonic\" comes from, or monotonous, monotone.", "ja": "単調なという意味の monotonic、monotonous、monotone は、ここから来ている。", "塊": [{"en": "That's where the word \"monotonic\" comes from,", "s": 16.28, "e": 19.23}, {"en": "or monotonous, monotone.", "s": 19.23, "e": 21.01}]}, {"s": 21.56, "e": 29.79, "en": "Also, we have repetitive prosody now coming in, where every sentence ends as if it were a question when it's actually not a question, it's a statement?", "ja": "それに最近は、同じ抑揚の繰り返しも増えている。実際は質問じゃなくて普通の文なのに、どの文も質問みたいに語尾が上がるやつだ。", "塊": [{"en": "Also, we have repetitive", "s": 21.56, "e": 23.47}, {"en": "prosody now coming in,", "s": 23.47, "e": 24.75}, {"en": "where every sentence ends", "s": 24.75, "e": 26.37}, {"en": "as if it were a question", "s": 26.37, "e": 27.33}, {"en": "when it's actually not a question,", "s": 27.5, "e": 29.03}, {"en": "it's a statement?", "s": 29.03, "e": 29.79}]}, {"s": 32.12, "e": 41.47, "en": "And if you repeat that one, it's actually restricting your ability to communicate through prosody, which I think is a shame, so let's try and break that habit.", "ja": "それを繰り返していると、抑揚で伝える力をかえって狭めてしまう。もったいないと思うので、その癖はやめるようにしよう。", "塊": [{"en": "And if you repeat", "s": 32.12, "e": 33.81}, {"en": "that one,", "s": 33.81, "e": 34.11}, {"en": "it's actually restricting your ability", "s": 34.46, "e": 36.37}, {"en": "to communicate through prosody,", "s": 36.37, "e": 37.81}, {"en": "which I think is a shame,", "s": 37.81, "e": 39.05}, {"en": "so let's try", "s": 39.28, "e": 40.41}, {"en": "and break that habit.", "s": 40.41, "e": 41.47}]}, {"s": 42.66, "e": 43.28, "en": "Pace.", "ja": "速さ（pace）。", "塊": [{"en": "Pace.", "s": 42.66, "e": 43.28}]}, {"s": 43.28, "e": 53.17, "en": " function 秒表示(x){ x = Math.max(0, x||0); const m = Math.floor(x/60), s = Math.floor(x%60); return m + ":" + String(s).padStart(2,"0"); }
function しまう(){ st.区間の記憶[st.talk] = st.seg; try{ localStorage.setItem(保存キー, JSON.stringify({talk:st.talk, seg:st.seg, 区間の記憶:st.区間の記憶, subs:st.subs, loop:st.loop, rate:st.rate, gap:st.gap, unit:st.unit, step:st.step})); }catch(e){} }

/* ── 組み立て ───────────────────── */
(function トークボタン(){
  const box = $("#talks");
  for(const k of Object.keys(DATA)){
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.v = k; b.textContent = DATA[k].話者;
    box.appendChild(b);
  }
})();

// 区間の数はトークごとに違うので、トークを替えるたびに作り直す
function 区間ボタン(){
  const box = $("#segs");
  box.innerHTML = "";
  for(const k of Object.keys(トーク().区間)){
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.v = k; b.textContent = k;
    box.appendChild(b);
  }
}

function トークを当てる(){
  const t = トーク();
  $("#speaker").textContent = t.話者;
  $("#talkinfo").textContent = "TED " + t.年 + " · " + t.wpm + " wpm";
  $("#src").href = t.出典;
  document.title = t.題 + "｜TED リスニング";
  区間ボタン();
}

function 描く(){
  文 = 区().文;
  main.innerHTML = "";
  文.forEach((s, i) => {
    const row = document.createElement("button");
    row.className = "line"; row.dataset.i = i;
    row.innerHTML =
      '<span class="n">' + (i+1) + '<span class="dur">' + (s.e - s.s).toFixed(1) + 's</span></span>' +
      '<span class="body">' +
        '<span class="en"></span>' +
        '<span class="ja"></span>' +
      '</span>';
    // 英文はかたまりごとに包む。区切りが「かたまり」のときだけ / が見えて、今のかたまりが光る
    const en = row.querySelector(".en");
    (s.塊 || [{en: s.en}]).forEach((c, k) => {
      // 区切りが「文」のときは / を隠すので、語と語の間の空白は / の外に置く（中に入れていて語がくっついていた）
      if(k){ en.appendChild(document.createTextNode(" ")); const sl = document.createElement("span"); sl.className = "sl"; sl.textContent = "/ "; en.appendChild(sl); }
      const ck = document.createElement("span"); ck.className = "ck"; ck.dataset.k = k; ck.textContent = c.en;
      en.appendChild(ck);
    });
    row.querySelector(".ja").textContent = s.ja;
    main.appendChild(row);
  });
  idx = -1; u = -1; 固定 = -1; 待ちをやめる();
  audio.src = 音声の場所(st.talk, st.seg);
  audio.playbackRate = st.rate;
  st.a = st.b = null;
  単位を作る();
  字幕を当てる(); 印を塗る(); 助言(); ボタンを揃える();
  $("#tend").textContent = 秒表示(文[文.length-1].e);
  $("#segtitle").textContent = 区().見出し;
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "区間" + st.seg + "｜" + 区().見出し,
      artist: トーク().話者, album: トーク().題
    });
  }
}

function 単位を作る(){
  単位 = st.unit === "塊"
    ? 文.flatMap((s, i) => (s.塊 || [{s:s.s, e:s.e}]).map((c, k) => ({s:c.s, e:c.e, i, k: s.塊 ? k : -1})))
    : 文.map((s, i) => ({s:s.s, e:s.e, i, k:-1}));
  main.classList.toggle("slashes", st.unit === "塊");
  u = -1;
}

function 字幕を当てる(){
  const 英 = st.subs === "en" || st.subs === "both";
  const 日 = st.subs === "ja" || st.subs === "both";
  main.querySelectorAll(".line").forEach((row, i) => {
    // 英文は「なし」でも場所は取らせる。行の長さで文の長さの見当がつく方が書き取りに効く
    row.querySelector(".en").classList.toggle("veil", !英 && !(見せる && i === idx));
    row.querySelector(".ja").hidden = !日;
  });
}

function 印を塗る(){
  const a = st.a, b = st.b;
  main.querySelectorAll(".line").forEach((row, i) => {
    row.classList.toggle("now", i === idx);
    row.classList.toggle("done", idx >= 0 && i < idx);
    row.classList.toggle("mark-a", a === i);
    row.classList.toggle("mark-b", b === i);
    row.classList.toggle("inrange", a !== null && b !== null && i >= a && i <= b);
    const old = row.querySelector(".tag"); if(old) old.remove();
    if(a === i || b === i){
      const t = document.createElement("span");
      t.className = "tag"; t.textContent = (a === i ? "A" : "B");
      row.querySelector(".body").prepend(t);
    }
  });
}

function 塊を塗る(){
  main.querySelectorAll(".ck.on").forEach(el => el.classList.remove("on"));
  const x = 単位[u];
  if(st.unit !== "塊" || !x || x.k < 0) return;
  const el = main.querySelector('.line[data-i="' + x.i + '"] .ck[data-k="' + x.k + '"]');
  if(el) el.classList.add("on");
}

function ボタンを揃える(){
  const 当てる = (id, v) => document.querySelectorAll("#" + id + " .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v == v)));
  当てる("talks", st.talk); 当てる("segs", st.seg); 当てる("subs", st.subs); 当てる("loops", st.loop);
  当てる("rates", st.rate); 当てる("gaps", st.gap); 当てる("units", st.unit); 当てる("steps", st.step);
  $("#loop-one").textContent = st.unit === "塊" ? "1かたまり" : "1文";
  $("#reveal").setAttribute("aria-pressed", String(見せる));
}

function 助言(){
  if(st.step && 段階[st.step]){ hint.innerHTML = 段階[st.step].説明; return; }
  if(st.loop === "ab"){
    if(st.a === null) hint.innerHTML = "繰り返したい範囲の<strong>最初の文</strong>をタップ";
    else if(st.b === null) hint.innerHTML = "次に<strong>最後の文</strong>をタップ（同じ文でもいい）";
    else hint.innerHTML = (st.a+1) + "〜" + (st.b+1) + " を繰り返し中。もう一度タップすると引き直せる";
  } else if(st.loop === "one"){ hint.textContent = (st.unit === "塊" ? "今のかたまり" : "今の1文") + "を繰り返す。文をタップするとそこへ移る";
  } else if(st.loop === "step"){ hint.textContent = (st.unit === "塊" ? "かたまり" : "1文") + "ごとに止まって、間のあと次へ進む。間の「自動」は聞いた長さ＋少し";
  } else if(st.loop === "seg"){ hint.textContent = "区間の終わりまで行ったら頭に戻る";
  } else if(st.loop === "all"){ hint.textContent = "区間1から5まで通して流す。5の後は1に戻る";
  } else { hint.textContent = "文をタップするとそこから再生。字幕なしで聞いて「今の文」で答え合わせ"; }
}

/* ── 動き ───────────────────────── */
function 今どこ(t){
  for(let i = 単位.length - 1; i >= 0; i--) if(t >= 単位[i].s - 0.05) return i;
  return 0;   // 冒頭の拍手や間はこれから読む単位に含める
}

function 文の頭(i){ const j = 単位.findIndex(x => x.i === i); return j < 0 ? 0 : j; }

function 飛ぶ(秒, 鳴らす){
  待ちをやめる();
  秒 = Math.max(0, 秒);
  audio.currentTime = 秒;
  // 飛んだ直後も古い位置が返ることがあり、境目を越えたと見て止まったり、
  // 止めて進むでタップしたかたまりを飛ばしたりした。着くまで見張りを止めておく
  ループ中 = true;
  着くまで待つ(秒, 世代);
  if(鳴らす !== false) audio.play().catch(()=>{});
}

// 間の長さ。「自動」は聞いた長さ（速さで伸びた分も込み）＋0.8秒。言い返すのに要る時間の目安
function 間の秒(x){
  if(st.gap === "auto") return x ? Math.max(1.2, (x.e - x.s) / st.rate + 0.8) : 1.5;
  return +st.gap || 0;
}

let 世代 = 0;   // 待ちをやめたら上がる。古い待ちが後から ループ中 を下ろさないように

// 間の残りを再生ボタンの横に出す。止まって見えるのが故障なのか間なのか分かるように（2026-10-24 本人報告：1文ループが全然戻らない）
let 残りタイマー = null;
function 残りを出す(終わる時刻){
  if(残りタイマー){ clearInterval(残りタイマー); 残りタイマー = null; }
  const el = $("#gapcount");
  if(!終わる時刻){ el.textContent = ""; return; }
  const 描 = () => {
    const 残 = (終わる時刻 - Date.now()) / 1000;
    if(残 <= 0){ clearInterval(残りタイマー); 残りタイマー = null; el.textContent = ""; return; }
    el.textContent = "間 " + 残.toFixed(1) + "秒";
  };
  描(); 残りタイマー = setInterval(描, 100);
}

function 待ちをやめる(){
  残りを出す(null);
  if(待ちタイマー){ clearTimeout(待ちタイマー); 待ちタイマー = null; }
  世代++;
  ループ中 = false;
}

// 止めて、待ってから「的」の秒へ戻して鳴らし直す。待ちが 0 なら止めずに戻すだけ。
// 準備 は戻す直前にすること（固定 を次へ進めるなど）
function 間をあけて(待ち, 的, 準備){
  if(ループ中) return;
  ループ中 = true;
  const 私 = 世代;
  const 戻す = () => {
    if(準備) 準備();
    audio.currentTime = Math.max(0, 的);
    if(待ち > 0) audio.play().catch(()=>{});
    着くまで待つ(的, 私);
  };
  if(待ち > 0){
    audio.pause();
    残りを出す(Date.now() + 待ち * 1000);
    待ちタイマー = setTimeout(() => { 待ちタイマー = null; 残りを出す(null); if(私 === 世代) 戻す(); }, 待ち * 1000);
  } else {
    戻す();
  }
}

// iPhone の Safari は、戻す位置を指定してから読み込みが終わるまで currentTime が古い位置を返すことがある。
// すぐ見張りを再開すると、古い位置を見て「文の終わりを越えた」ともう一度止まり、間が2回分空いた（2026-10-13 本人報告）。
// 戻した位置に本当に着いたのを見てから ループ中 を下ろす。2秒たっても着かなければ諦めて下ろす
function 着くまで待つ(的, 私){
  const 始 = Date.now();
  const 見る = () => {
    if(私 !== 世代) return;
    const 着いた = !audio.seeking && Math.abs(audio.currentTime - 的) < 0.6;
    if(着いた || Date.now() - 始 > 2000){ ループ中 = false; return; }
    setTimeout(見る, 50);
  };
  見る();
}

// 境目を越えたら戻す・止める。rAF は iPhone で画面を消すと止まるので、
// timeupdate と 0.1 秒のタイマーからも呼ぶ（どれか1つが生きていれば効く）
function 境目を見る(){
  if(ループ中 || audio.paused || audio.seeking || !単位.length) return;
  const t = audio.currentTime;
  if(st.loop === "one"){
    if(固定 < 0) 固定 = 今どこ(t);
    const x = 単位[固定];
    if(t >= x.e - 0.03 || t < x.s - 0.3) 間をあけて(間の秒(x), x.s);
  } else if(st.loop === "step"){
    if(固定 < 0) 固定 = 今どこ(t);
    const x = 単位[固定];
    if(t < x.s - 0.3){ 固定 = 今どこ(t); return; }
    if(t >= x.e - 0.03){
      const n = 固定 + 1;
      if(n >= 単位.length){ audio.pause(); return; }
      間をあけて(間の秒(x), 単位[n].s, () => { 固定 = n; });
    }
  } else if(st.loop === "ab" && st.a !== null && st.b !== null){
    if(t >= 文[st.b].e - 0.03 || t < 文[st.a].s - 0.3) 間をあけて(間の秒(null), 文[st.a].s);
  }
}
audio.addEventListener("timeupdate", 境目を見る);
setInterval(境目を見る, 100);

function 拍(){
  const t = audio.currentTime;
  if(!つまみ中){
    const 尻 = 文[文.length-1].e;
    seek.value = Math.round(Math.min(1, t / 尻) * 1000);
    $("#tnow").textContent = 秒表示(t);
  }
  境目を見る();
  if(単位.length){
    const 今u = ((st.loop === "one" || st.loop === "step") && 固定 >= 0) ? 固定 : 今どこ(t);
    if(今u !== u){ u = 今u; 塊を塗る(); }
    const 新 = 単位[u].i;
    if(新 !== idx){
      idx = 新; 見せる = false;
      印を塗る(); 字幕を当てる(); ボタンを揃える(); 塊を塗る();
      const row = main.querySelector('.line[data-i="' + idx + '"]');
      if(row && Date.now() - 手で動かした > 5000) row.scrollIntoView({block:"center", behavior:"smooth"});
    }
  }
  requestAnimationFrame(拍);
}
requestAnimationFrame(拍);

audio.addEventListener("ended", () => {
  if(st.loop === "all"){
    // 全体：区間の終わりで次の区間へ。最後の区間の後は区間1に戻る
    st.seg = st.seg % 区間数() + 1; しまう(); 描く(); ボタンを揃える();
    audio.play().catch(()=>{});
    return;
  }
  if(st.loop === "seg"){ 間をあけて(間の秒(null), 0); if(!(間の秒(null) > 0)) audio.play().catch(()=>{}); }
  else 再生表示(false);
});
audio.addEventListener("play", () => { 再生表示(true); 眠らせない(); });
audio.addEventListener("pause", () => { if(!ループ中) 再生表示(false); });

function 再生表示(鳴ってる){
  $("#playicon").innerHTML = 鳴ってる
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $("#play").setAttribute("aria-label", 鳴ってる ? "一時停止" : "再生");
}

let 錠 = null;
async function 眠らせない(){
  try{ if("wakeLock" in navigator && !錠) 錠 = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && !audio.paused) 眠らせない(); });

/* ── 操作 ───────────────────────── */
main.addEventListener("click", e => {
  const row = e.target.closest(".line"); if(!row) return;
  const i = +row.dataset.i;
  if(st.loop === "ab"){
    if(st.a === null || st.b !== null){ st.a = i; st.b = null; 飛ぶ(文[i].s); }
    else if(i >= st.a){ st.b = i; 飛ぶ(文[st.a].s); }
    else { st.a = i; 飛ぶ(文[i].s); }
    印を塗る(); 助言();
  } else {
    固定 = 文の頭(i);
    飛ぶ(単位[固定].s);
  }
});

$("#play").addEventListener("click", () => {
  // 間の途中で押したら、待ちをやめて止まる（再生ボタンの見た目は鳴っている扱いのままなので）
  if(ループ中 && audio.paused){ 待ちをやめる(); 再生表示(false); return; }
  if(audio.paused) audio.play().catch(()=>{}); else { 待ちをやめる(); audio.pause(); }
});
function 今の単位(){ return ((st.loop === "one" || st.loop === "step") && 固定 >= 0) ? 固定 : 今どこ(audio.currentTime); }
$("#prev").addEventListener("click", () => {
  const 今 = 今の単位();
  const 頭に戻すか = 今 >= 0 && audio.currentTime - 単位[今].s > 1.2;
  const j = 頭に戻すか ? 今 : Math.max(0, 今 - 1);
  固定 = j;
  飛ぶ(単位[j].s);
});
$("#next").addEventListener("click", () => { const j = Math.min(単位.length - 1, 今の単位() + 1); 固定 = j; 飛ぶ(単位[j].s); });

seek.addEventListener("pointerdown", () => { つまみ中 = true; });
seek.addEventListener("change", () => {
  つまみ中 = false;
  const 先 = (seek.value / 1000) * 文[文.length-1].e;
  固定 = 今どこ(先);
  飛ぶ(先, !audio.paused);
});
seek.addEventListener("input", () => { $("#tnow").textContent = 秒表示((seek.value / 1000) * 文[文.length-1].e); });

main.addEventListener("scroll", () => { 手で動かした = Date.now(); }, {passive:true});

function 束ねる(id, 効く){
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    // 段階を選んだ後に設定を手で変えたら、段階の印は外す
    if(id !== "steps" && id !== "segs" && id !== "talks") st.step = null;
    効く(b.dataset.v); ボタンを揃える(); 助言(); しまう();
  });
}
function 区切りを変える(v){
  st.unit = v; 単位を作る();
  固定 = 今どこ(audio.currentTime); 塊を塗る();
}
束ねる("talks", v => {
  if(v === st.talk) return;
  audio.pause(); しまう();
  st.talk = v; st.seg = st.区間の記憶[v] || 1;
  if(!区()) st.seg = 1;
  トークを当てる(); 描く();
});
束ねる("segs",  v => { const 鳴ってた = !audio.paused; st.seg = +v; 描く(); if(鳴ってた) audio.play().catch(()=>{}); });
束ねる("subs",  v => { st.subs = v; 字幕を当てる(); });
束ねる("loops", v => { 待ちをやめる(); st.loop = v; st.a = st.b = null; 固定 = Math.max(0, 今どこ(audio.currentTime)); 印を塗る(); });
束ねる("rates", v => { st.rate = +v; audio.playbackRate = st.rate; });
束ねる("gaps",  v => { st.gap = v === "auto" ? "auto" : +v; });
束ねる("units", v => 区切りを変える(v));
束ねる("steps", v => {
  const p = 段階[v]; if(!p) return;
  待ちをやめる();
  st.step = v; st.subs = p.subs; st.loop = p.loop; st.gap = p.gap; st.rate = p.rate; st.a = st.b = null;
  audio.playbackRate = st.rate;
  区切りを変える(p.unit);
  字幕を当てる(); 印を塗る();
});

$("#reveal").addEventListener("click", () => { 見せる = !見せる; 字幕を当てる(); ボタンを揃える(); });

document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){ e.preventDefault(); $("#play").click(); }
  if(e.code === "ArrowLeft"){ e.preventDefault(); $("#prev").click(); }
  if(e.code === "ArrowRight"){ e.preventDefault(); $("#next").click(); }
});

トークを当てる(); 描く(); 再生表示(false);

/* ── 圏外で使う準備 ─────────────────── */
// sw.js の 音声キャッシュ と揃える（殻のキャッシュとは別。コードを直しても音声は取り直さない）
const キャッシュ名 = "ted-audio-v2";
const 音源一覧 = Object.keys(DATA).flatMap(名 => Object.keys(DATA[名].区間).map(n => new URL(音声の場所(名, n), location.href).href));

async function 保存状況(){
  const el = $("#offline");
  if(!("caches" in window)){ el.textContent = ""; return 0; }
  try{
    const c = await caches.open(キャッシュ名);
    let n = 0;
    for(const u of 音源一覧) if(await c.match(u)) n++;
    el.textContent = n >= 音源一覧.length ? "圏外OK" : "保存中 " + n + "/" + 音源一覧.length;
    el.classList.toggle("ok", n >= 音源一覧.length);
    return n;
  }catch(e){ el.textContent = ""; return 0; }
}

async function 貯める(){
  if(!("caches" in window)) return;
  try{
    const c = await caches.open(キャッシュ名);
    for(const u of 音源一覧){
      if(await c.match(u)) continue;
      try{ const r = await fetch(u); if(r.ok){ await c.put(u, r); 保存状況(); } }catch(e){}
    }
  }catch(e){}
  保存状況();
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
保存状況().then(n => { if(n < 音源一覧.length) 貯める(); });
</script>
